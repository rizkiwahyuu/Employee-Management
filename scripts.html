<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // Registrasi plugin DataLabels secara global untuk Chart.js
        if (window.Chart && window.ChartDataLabels) {
            window.Chart.register(window.ChartDataLabels);
            window.Chart.defaults.set('plugins.datalabels', {
                color: '#ffffff',
                font: { weight: 'bold', size: 15 },
                textStrokeColor: 'rgba(0,0,0,0.5)',
                textStrokeWidth: 3,
                display: function (context) {
                    return context.dataset.data[context.dataIndex] > 0;
                }
            });
        }

        // ==========================================
        // GLOBAL DATE CONTEXT — Sumber Waktu Terpusat
        // ==========================================
        // Helper: mendapatkan tanggal hari ini format YYYY-MM-DD sesuai WIB
        const getTodayWIB = () => {
            const now = new Date();
            // WIB = UTC+7
            const wib = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            const y = wib.getUTCFullYear();
            const m = String(wib.getUTCMonth() + 1).padStart(2, '0');
            const d = String(wib.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        // Helper: format tanggal panjang WIB (mis: "Selasa, 6 Mei 2026")
        const getLongDateWIB = () => {
            const now = new Date();
            const wib = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${days[wib.getUTCDay()]}, ${wib.getUTCDate()} ${months[wib.getUTCMonth()]} ${wib.getUTCFullYear()}`;
        };

        // Helper: format jam WIB (mis: "12:43:24")
        const getTimeWIB = () => {
            const now = new Date();
            const wib = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            const h = String(wib.getUTCHours()).padStart(2, '0');
            const m = String(wib.getUTCMinutes()).padStart(2, '0');
            const s = String(wib.getUTCSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        };

        // Live Clock Component untuk header — menerima prop 'now' dari MainApp (satu clock terpusat)
        const LiveClock = ({ now }) => {
            return (
                <div className="flex items-center gap-3">
                    <div className="text-sm font-bold text-slate-500 leading-tight text-right">{getLongDateWIB()}</div>
                    <div className="w-10 h-10 bg-brand-50 border border-brand-200 rounded-xl flex items-center justify-center text-brand-600 text-xl shadow-sm">
                        <i className="bx bx-calendar"></i>
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ icon, label, active, onClick }) => (
            <div onClick={onClick} className={`flex items-center gap-3 px-4 py-3 mx-4 my-1 rounded-xl cursor-pointer transition-all duration-300 ${active ? 'bg-brand-600 text-white shadow-md font-semibold' : 'text-slate-400 hover:bg-navy-800 hover:text-white'}`}>
                <i className={`${icon} text-xl ${active ? 'text-white' : ''}`}></i><span className="text-sm">{label}</span>
            </div>
        );

        const StatCard = ({ title, value, sub, icon, isRed, onClick }) => (
            <div onClick={onClick} className={`rounded-2xl p-6 shadow-sm border relative overflow-hidden cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all duration-300 ${isRed ? 'bg-gradient-to-br from-brand-500 to-brand-700 border-brand-500 text-white' : 'bg-white border-slate-200 text-navy-900 hover:border-brand-300'}`}>
                <div className="flex justify-between items-start mb-4 relative z-10">
                    <div className="flex items-center gap-2"><i className={`${icon} text-xl ${isRed ? 'text-brand-200' : 'text-brand-600'}`}></i><span className={`text-xs font-bold uppercase tracking-wider ${isRed ? 'text-brand-100' : 'text-slate-500'}`}>{title}</span></div>
                    <i className={`bx bx-right-top-arrow-circle text-lg opacity-50 ${isRed ? 'text-white' : 'text-brand-600'}`}></i>
                </div>
                <div className="relative z-10"><h3 className="text-4xl font-black">{value}</h3>{sub && <p className={`text-xs mt-1 ${isRed ? 'text-brand-200' : 'text-slate-400'}`}>{sub}</p>}</div>
                {isRed && <div className="absolute -right-8 -top-8 w-32 h-32 bg-white opacity-20 rounded-full blur-2xl"></div>}
            </div>
        );

        const Badge = ({ text, type }) => {
            const styles = { success: 'bg-emerald-100 text-emerald-700', warning: 'bg-amber-100 text-amber-700', danger: 'bg-red-100 text-red-700', neutral: 'bg-slate-100 text-slate-600', brand: 'bg-brand-100 text-brand-700' };
            const isSmallText = String(text).toUpperCase() === 'PRIA' || String(text).toUpperCase() === 'TELAH MENGAJUKAN ACTIVITY';
            return <span className={`px-2 py-0.5 rounded-full ${isSmallText ? 'text-[9px]' : 'text-[10px]'} font-bold tracking-wide uppercase border border-white/20 shadow-sm ${styles[type] || styles.neutral}`}>{text || '-'}</span>;
        };

        const ModalPortal = ({ children }) => ReactDOM.createPortal(children, document.body);
        const MODAL_WIDTH_CLASS = {
            compact: 'max-w-2xl xl:max-w-3xl',
            default: 'max-w-4xl xl:max-w-5xl',
            wide: 'max-w-5xl xl:max-w-6xl',
            full: 'max-w-[min(96vw,96rem)]'
        };
        const getModalFrameClass = (size = 'default') => `relative w-full ${MODAL_WIDTH_CLASS[size] || MODAL_WIDTH_CLASS.default} flex justify-center pointer-events-auto`;
        const modalPanelClass = 'relative z-10 bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border border-white/60 w-full flex flex-col overflow-hidden modal-enter cursor-default min-h-0 max-h-[calc(100vh-1.5rem)] sm:max-h-[calc(100vh-3rem)]';
        const modalBodyScrollClass = 'overflow-y-auto flex-1 min-h-0 custom-scrollbar';
        const modalBodyPaddedScrollClass = 'p-6 overflow-y-auto flex-1 min-h-0 custom-scrollbar bg-transparent';

        const isSpreadsheetRuntimeReady = () => {
            return typeof google !== 'undefined' && google.script && google.script.run;
        };

        const alertSpreadsheetRuntimeRequired = () => {
            alert("Sinkronisasi Spreadsheet hanya bisa dijalankan melalui Google Apps Script Web App.");
        };

        // getFormattedDateYMD: Pakai waktu lokal (bukan UTC) agar sinkron dengan WIB server
        const getFormattedDateYMD = (date) => {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        // formatDateDMY: Ubah tanggal ke format tampilan DD/MM/YYYY (Hari/Bulan/Tahun)
        // Input bisa berupa string "YYYY-MM-DD", "DD/MM/YYYY", atau object Date
        // PENTING: Semua path melalui parseDateStringSafe agar koreksi tahun 2-digit aktif.
        const formatDateDMY = (dateStr) => {
            if (!dateStr || dateStr === '-') return '-';
            // Semua format diproses lewat parseDateStringSafe (agar koreksi tahun aktif)
            const parsed = parseDateStringSafe(dateStr);
            if (parsed) {
                const day = String(parsed.getDate()).padStart(2, '0');
                const month = String(parsed.getMonth() + 1).padStart(2, '0');
                const year = parsed.getFullYear();
                return `${day}/${month}/${year}`;
            }
            // Jika sudah format DD/MM/YYYY dan gagal parse, kembalikan apa adanya
            if (typeof dateStr === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateStr.trim())) {
                return dateStr.trim();
            }
            return String(dateStr).trim() || '-';
        };

        const formatDateLongID = (dateStr) => {
            const parsed = parseDateStringSafe(dateStr);
            if (!parsed) return String(dateStr || '-').trim() || '-';
            return parsed.toLocaleDateString('id-ID', {
                weekday: 'long',
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });
        };

        const formatCountdownYMD = (fromDate, toDate, expiredLabel = 'Sudah Pensiun') => {
            if (!(fromDate instanceof Date) || isNaN(fromDate.getTime()) || !(toDate instanceof Date) || isNaN(toDate.getTime())) return '-';
            if (toDate.getTime() <= fromDate.getTime()) return expiredLabel;

            let y = toDate.getFullYear() - fromDate.getFullYear();
            let m = toDate.getMonth() - fromDate.getMonth();
            let d = toDate.getDate() - fromDate.getDate();

            if (d < 0) {
                m--;
                const prevMonth = new Date(toDate.getFullYear(), toDate.getMonth(), 0);
                d += prevMonth.getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            const parts = [];
            if (y > 0) parts.push(`${y} Thn`);
            if (m > 0) parts.push(`${m} Bln`);
            if (d > 0 || parts.length === 0) parts.push(`${d} Hari`);
            return parts.join(' ');
        };

        const normalizeDateString = (dateStr) => {
            if (!dateStr) return '';
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts[2] && parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            return String(dateStr).trim();
        };

        // normalizeDateForInput: Konversi tanggal ke format YYYY-MM-DD untuk <input type="date">
        // Termasuk koreksi tahun 2-digit (1900-1968 -> +100) agar nilai edit form benar.
        const normalizeDateForInput = (dateStr) => {
            const parsed = parseDateStringSafe(dateStr);
            if (!parsed) return normalizeDateString(dateStr);
            const y = String(parsed.getFullYear()).padStart(4, '0');
            const m = String(parsed.getMonth() + 1).padStart(2, '0');
            const d = String(parsed.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const parseDateStringSafe = (dateStr) => {
            if (!dateStr) return null;
            let resultDate = null;

            if (dateStr instanceof Date && !isNaN(dateStr.getTime())) {
                resultDate = new Date(dateStr.getFullYear(), dateStr.getMonth(), dateStr.getDate());
            } else {
                const s = String(dateStr).trim();
                if (!s || s === '-') return null;

                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
                    resultDate = new Date(s + 'T00:00:00');
                } else if (/^\d{1,2}\/\d{1,2}\/\d{2,4}(?:\s+\d{1,2}[:.]\d{1,2}(?::\d{1,2})?)?$/.test(s)) {
                    // Format Google Sheets: M/D/YY atau M/D/YYYY (p1=BULAN, p2=HARI)
                    const parts = s.split(' ')[0].split('/');
                    const month = parseInt(parts[0], 10);  // p1 = BULAN
                    const day = parseInt(parts[1], 10);  // p2 = HARI
                    let year = parseInt(parts[2], 10);
                    if (year < 100) year = year <= 50 ? 2000 + year : 1900 + year;
                    resultDate = new Date(`${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T00:00:00`);
                } else if (/^\d{4}\/\d{1,2}\/\d{1,2}(?:\s+\d{1,2}[:.]\d{1,2}(?::\d{1,2})?)?$/.test(s)) {
                    const parts = s.split(' ')[0].split('/');
                    resultDate = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                } else if (/^\d{1,2}-\d{1,2}-\d{2,4}(?:\s+\d{1,2}[:.]\d{1,2}(?::\d{1,2})?)?$/.test(s)) {
                    const parts = s.split(' ')[0].split('-');
                    const p1 = parseInt(parts[0], 10);
                    const p2 = parseInt(parts[1], 10);
                    let year = parseInt(parts[2], 10);
                    if (year < 100) year = year <= 50 ? 2000 + year : 1900 + year;
                    let month, day;
                    if (p1 > 12) { day = p1; month = p2; } else { month = p1; day = p2; }
                    resultDate = new Date(`${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T00:00:00`);
                } else {
                    resultDate = new Date(s);
                }
            }

            if (resultDate && !isNaN(resultDate.getTime())) {
                const y = resultDate.getFullYear();
                // Bug fix untuk tahun 2 digit yang diterjemahkan Google Sheets sebagai 19xx. 
                // Jika tahun < 1968, maka hampir pasti itu adalah tahun 20xx (misal 1951 -> 2051)
                // karena tidak ada karyawan aktif yang seharusnya lahir di bawah tahun 1950 apalagi memiliki tahun mulai kerja/pensiun sejauh itu.
                if (y >= 1900 && y <= 1968) {
                    resultDate.setFullYear(y + 100);
                }
                return resultDate;
            }
            return null;
        };

        // NIK Normalization — identik dengan backend Code.gs
        // Strip desimal Excel (.0) dan leading zeros agar "0123456" == "123456"
        const normalizeNikKey = (value) => {
            let raw = String(value ?? '').trim();
            raw = raw.replace(/\.0+$/g, ''); // Hapus desimal Excel
            raw = raw.replace(/^0+/, '');    // Hapus leading zeros
            return raw;
        };

        const buildDateRangeKeys = (startStr, endStr) => {
            const start = parseDateStringSafe(startStr);
            const end = parseDateStringSafe(endStr);
            if (!start || !end) return [];

            const safeStart = new Date(start.getFullYear(), start.getMonth(), start.getDate());
            const safeEnd = new Date(end.getFullYear(), end.getMonth(), end.getDate());
            if (safeStart > safeEnd) return [];

            const keys = [];
            const cursor = new Date(safeStart);
            while (cursor <= safeEnd) {
                keys.push(getFormattedDateYMD(cursor));
                cursor.setDate(cursor.getDate() + 1);
            }
            return keys;
        };

        // calculateMasaKerja: Menghitung masa kerja relatif terhadap waktu saat ini (real-time)
        const calculateMasaKerja = (dateStr) => {
            if (!dateStr) return { totalBulan: 0, teks: '-' };
            const start = parseDateStringSafe(dateStr);
            if (!start) return { totalBulan: 0, teks: '-' };

            // Gunakan waktu sekarang (WIB) — getTodayWIB untuk referensi tanggal
            const now = new Date();
            const diffTime = now.getTime() - start.getTime();
            if (diffTime < 0) return { totalBulan: 0, teks: 'Belum Mulai' };

            const totalMonths = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 30.44));
            const years = Math.floor(totalMonths / 12);
            const months = totalMonths % 12;
            let text = '';
            if (years > 0) text += `${years} Thn `;
            if (months > 0 || years === 0) text += `${months} Bln`;
            return { totalBulan: totalMonths, teks: text.trim() };
        };

        // ==========================================
        // KOMPONEN GRAFIK (BASIC CHART.JS)
        // ==========================================

        const ChartUnit = ({ data, onDetail }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);
            const onDetailRef = useRef(onDetail);

            useEffect(() => { onDetailRef.current = onDetail; }, [onDetail]);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                // Kelompokkan berdasarkan Band Posisi (BP)
                const counts = {};
                data.forEach(d => {
                    const bp = String(d.band_posisi || 'Lainnya').toUpperCase().replace('BAND ', 'BP ');
                    counts[bp] = (counts[bp] || 0) + 1;
                });
                const sorted = Object.entries(counts).sort((a, b) => {
                    // Urut BP I, II, III, IV, V, VI
                    const order = ['BP I', 'BP II', 'BP III', 'BP IV', 'BP V', 'BP VI'];
                    const ia = order.indexOf(a[0]);
                    const ib = order.indexOf(b[0]);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    return b[1] - a[1];
                });
                const labels = sorted.map(d => d[0]);
                const vals = sorted.map(d => d[1]);
                const bgColors = ['#0A1D37', '#1d4ed8', '#3b82f6', '#60a5fa', '#93c5fd', '#14b8a6', '#0ea5e9', '#64748b', '#94a3b8'];

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'doughnut',
                    data: { labels, datasets: [{ data: vals, backgroundColor: bgColors.slice(0, labels.length), borderWidth: 2 }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
                            datalabels: { font: { size: 12, weight: 'bold' }, formatter: (val) => val > 0 ? val : '' }
                        },
                        onClick: (e, els) => { if (els.length > 0 && onDetailRef.current) onDetailRef.current('BP', labels[els[0].index], e.native); }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const ChartLokasi = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const counts = {};
                data.forEach(d => { counts[d.kota_gedung || 'Pusat'] = (counts[d.kota_gedung || 'Pusat'] || 0) + 1; });
                const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 7);
                const labels = sorted.map(d => d[0]);
                const vals = sorted.map(d => d[1]);

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Jumlah Pegawai', data: vals, backgroundColor: '#0A1D37', borderRadius: 4 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { display: false } } } }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const ChartPertumbuhan = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const counts = {};
                data.forEach(d => {
                    if (d.tgl_mulaikerja) {
                        const dt = parseDateStringSafe(d.tgl_mulaikerja);
                        if (dt && dt.getFullYear() > 1980) {
                            counts[dt.getFullYear()] = (counts[dt.getFullYear()] || 0) + 1;
                        }
                    }
                });
                const labels = Object.keys(counts).sort((a, b) => a - b);
                const vals = labels.map(y => counts[y]);

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'line',
                    data: { labels, datasets: [{ label: 'Rekrutmen', data: vals, borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.1)', tension: 0.4, fill: true, pointBackgroundColor: '#2563eb' }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { datalabels: { display: false }, legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { display: false } } }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const ChartGenerasi = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const currentYear = new Date().getFullYear();
                const counts = { 'Baby Boomers': 0, 'Gen X': 0, 'Gen Y (Milenial)': 0, 'Gen Z': 0, 'Gen Alpha': 0 };
                data.forEach(d => {
                    const age = parseInt(d.usia);
                    if (!isNaN(age)) {
                        const bYear = currentYear - age;
                        if (bYear >= 2013) counts['Gen Alpha']++;
                        else if (bYear >= 1997) counts['Gen Z']++;
                        else if (bYear >= 1981) counts['Gen Y (Milenial)']++;
                        else if (bYear >= 1965) counts['Gen X']++;
                        else counts['Baby Boomers']++;
                    }
                });
                const labels = Object.keys(counts).filter(k => counts[k] > 0);
                const vals = labels.map(k => counts[k]);

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'pie',
                    data: { labels, datasets: [{ data: vals, backgroundColor: ['#0A1D37', '#2563eb', '#38bdf8', '#14b8a6', '#64748b'], borderWidth: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const ChartPendidikan = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const counts = {};
                data.forEach(d => { counts[d.level_pendidikan || 'Tidak Terdata'] = (counts[d.level_pendidikan || 'Tidak Terdata'] || 0) + 1; });
                const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
                const labels = sorted.map(d => d[0]);
                const vals = sorted.map(d => d[1]);

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Jumlah Pegawai', data: vals, backgroundColor: '#3b82f6', borderRadius: 4 }] },
                    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { display: false } } } }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const ChartTrenPensiun = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !data || data.length === 0) return;

                const counts = {};
                // Gunakan tahun WIB saat ini sebagai acuan proyeksi
                const currentYear = parseInt(getTodayWIB().split('-')[0]);

                data.forEach(d => {
                    if (d.tgl_pensiun) {
                        const dt = parseDateStringSafe(d.tgl_pensiun);
                        if (dt) {
                            const yr = dt.getFullYear();
                            if (yr >= currentYear && yr <= currentYear + 10) {
                                counts[yr] = (counts[yr] || 0) + 1;
                            }
                        }
                    }
                });

                for (let i = currentYear; i <= currentYear + 10; i++) {
                    if (counts[i] === undefined) counts[i] = 0;
                }

                const labels = Object.keys(counts).sort((a, b) => a - b);
                const vals = labels.map(y => counts[y]);

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Proyeksi Pensiun', data: vals, backgroundColor: '#38bdf8', borderRadius: 4 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { display: false } } } }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);

            return <canvas ref={canvasRef}></canvas>;
        };

        const ChartActivityTrend = ({ dataKehadiran }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !dataKehadiran || dataKehadiran.length === 0) return;

                // Hitung trend 7 hari terakhir
                const todayWIBStr = getTodayWIB();
                const now = new Date(todayWIBStr + 'T00:00:00');

                const labels = [];
                const valsTelah = [];
                const valsCuti = [];
                const valsBelum = [];

                for (let i = 6; i >= 0; i--) {
                    const d = new Date(now.getTime() - (i * 24 * 60 * 60 * 1000));
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const dateStr = `${y}-${m}-${day}`;

                    const formattedDisplay = formatDateDMY(dateStr).substring(0, 5); // Just DD/MM
                    labels.push(formattedDisplay);

                    let countTelah = 0;
                    let countCuti = 0;
                    let countBelum = 0;

                    dataKehadiran.forEach(log => {
                        const recDate = normalizeDateString(log.tanggal);
                        if (recDate === dateStr) {
                            let rawStatus = String(log.status || log.status_pengajuan || '').toLowerCase();
                            let rawCuti = String(log.status_cuti || log.cuti || '').toLowerCase();
                            let finalStatus = 'Belum Mengajukan';

                            if (rawCuti && rawCuti !== '-' && rawCuti !== '' && rawCuti !== 'undefined') finalStatus = 'Cuti';
                            else if (rawStatus.includes('cuti') || rawStatus.includes('sakit') || rawStatus.includes('izin') || rawStatus.includes('leave')) finalStatus = 'Cuti';
                            else if (rawStatus.includes('telah') || rawStatus.includes('hadir') || rawStatus === 'v' || rawStatus.includes('wfo') || rawStatus.includes('wfh')) finalStatus = 'Telah Mengajukan Activity';
                            else if (rawStatus && !rawStatus.includes('belum') && rawStatus !== '-') finalStatus = 'Telah Mengajukan Activity';

                            if (finalStatus === 'Telah Mengajukan Activity') countTelah++;
                            else if (finalStatus === 'Cuti') countCuti++;
                            else countBelum++;
                        }
                    });

                    valsTelah.push(countTelah);
                    valsCuti.push(countCuti);
                    valsBelum.push(countBelum);
                }

                chartRef.current = new window.Chart(canvasRef.current, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: 'Telah Mengisi',
                                data: valsTelah,
                                borderColor: '#0A1D37',
                                backgroundColor: 'rgba(10, 29, 55, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#0A1D37'
                            },

                                label: 'Cuti / Izin',

                                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#2563eb'

                                label: 'Belum / Tidak Mengisi',
                                data: valsBelum,
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: '#38bdf8'
                            }
                        ]

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: { datalabels: { display: false }, legend: { position: 'top', labels: { boxWidth: 10, font: { size: 11 } } } },
                        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { borderDash: [2, 4] }, ticks: { stepSize: 1 } } }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };

        // 2. KARYAWAN 
        const KaryawanView = ({ data, isLoading, onRefreshData }) => {

            const [searchTerm, setSearchTerm] = useState('');
            const [filterBand, setFilterBand] = useState('');
            const [filterUnit, setFilterUnit] = useState('');

            const [isEditOpen, setIsEditOpen] = useState(false);
            const [editData, setEditData] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [clickPos, setClickPos] = useState({ x: null, y: null });

            const bandOptions = useMemo(() => {
                const bands = data.map(d => d.band_posisi).filter(Boolean);
                return [...new Set(bands)].sort();
            }, [data]);

            const unitOptions = useMemo(() => {
                const units = data.map(d => d.nama_unit).filter(Boolean);
                return [...new Set(units)].sort();
            }, [data]);

            const filteredData = useMemo(() => {
                const s = String(searchTerm).toLowerCase();
                return data.filter(emp => {
                    const matchSearch = !searchTerm ||
                        (emp.nama_karyawan && String(emp.nama_karyawan).toLowerCase().includes(s)) ||
                        (emp.nik && String(emp.nik).toLowerCase().includes(s)) ||
                        (emp.nama_unit && String(emp.nama_unit).toLowerCase().includes(s));

                    const matchBand = !filterBand || String(emp.band_posisi) === filterBand;
                    const matchUnit = !filterUnit || String(emp.nama_unit) === filterUnit;

                    return matchSearch && matchBand && matchUnit;
                });
            }, [data, searchTerm, filterBand, filterUnit]);

            const handleExportExcel = () => {
                if (filteredData.length === 0) return alert("Tidak ada data untuk diekspor!");
                const exportData = filteredData.map((emp, index) => ({
                    'No': index + 1,
                    'NIK': emp.nik || '-',
                    'Nama Lengkap': emp.nama_karyawan || '-',
                    'Jenis Kelamin': emp.jenis_kelamin || '-',
                    'Usia': emp.usia ? `${emp.usia} Tahun` : '-',
                    'Agama': emp.nama_agama || '-',
                    'Jabatan / Posisi': emp.nama_posisi || '-',
                    'Band Posisi': emp.band_posisi || '-',
                    'Unit / Divisi': emp.nama_unit || emp.nama_divisi || '-',
                    'Pendidikan': emp.level_pendidikan || '-',
                    'Jurusan': emp.jurusan_pendidikan || '-',
                    'Waktu Pensiun': emp.tgl_pensiun || '-',
                    'Lokasi Gedung': emp.kota_gedung || '-'
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Master_Karyawan");
                XLSX.writeFile(wb, "Data_Karyawan_Area3_TIF.xlsx", { bookType: "xlsx" });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return; setIsUploading(true); const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result; const wb = XLSX.read(bstr, { type: 'binary' }); const wsname = wb.SheetNames[0]; const ws = wb.Sheets[wsname]; const jsonData = XLSX.utils.sheet_to_json(ws, { defval: "" });
                        if (jsonData.length === 0) { alert("File kosong/format salah."); setIsUploading(false); return; }
                        if (typeof google !== 'undefined' && google.script) {
                            google.script.run.withSuccessHandler((res) => {
                                setIsUploading(false); const parsed = JSON.parse(res);
                                if (parsed.error) alert("Gagal impor: " + parsed.message); else { alert("SUKSES"); onRefreshData(); }
                            }).withFailureHandler((err) => { setIsUploading(false); alert("Error Server: " + err); }).bulkImportClient(jsonData);
                        } else { setIsUploading(false); alert("Live Environment required."); }
                    } catch (error) { setIsUploading(false); alert("Gagal membaca file."); }
                }; reader.readAsBinaryString(file); e.target.value = null;
            };

            const openEditModal = (emp, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setEditData({ ...emp }); setIsEditOpen(true);
            };

            const saveEdit = (e) => {
                e.preventDefault(); setIsSaving(true);
                const payload = { ...editData };
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run.withSuccessHandler((res) => {
                        setIsSaving(false); const parsed = JSON.parse(res);
                        if (parsed.error) alert("Gagal update: " + parsed.message); else { setIsEditOpen(false); onRefreshData(); }
                    }).withFailureHandler((err) => { setIsSaving(false); alert("Error: " + err); }).updateDataClient(payload);
                } else {

            const [isUploadInfoOpen, setIsUploadInfoOpen] = useState(false);

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedEmp, setSelectedEmp] = useState(null);
            const [usulType, setUsulType] = useState('PROMOSI');
            const [usulPosisi, setUsulPosisi] = useState('');

            const [usulBand, setUsulBand] = useState('');
            const [usulTalent, setUsulTalent] = useState('');
            const [usulKinerja, setUsulKinerja] = useState('');
            const [usulKompetensi, setUsulKompetensi] = useState('');
            const [usulBehavior, setUsulBehavior] = useState('');

            const [usulCatatan, setUsulCatatan] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [clickPos, setClickPos] = useState({ x: null, y: null });
            const [usulanData, setUsulanData] = useState([]);
            const [isLoadingUsulan, setIsLoadingUsulan] = useState(false);
            const [searchUsulan, setSearchUsulan] = useState('');
            const [activeTab, setActiveTab] = useState('daftar');


            // Filter States
            const [searchTerm, setSearchTerm] = useState('');
            const [filterBand, setFilterBand] = useState('');
            const [filterUnit, setFilterUnit] = useState('');
            const [filterKinerja, setFilterKinerja] = useState('');
            const [filterKompetensi, setFilterKompetensi] = useState('');
            const [filterBehavior, setFilterBehavior] = useState('');
            const [filterTalentCluster, setFilterTalentCluster] = useState('');
            const [filterKelayakan, setFilterKelayakan] = useState('');
            const [filterEligible, setFilterEligible] = useState(false);

            // Extract Options for Dropdowns
            const bandOptions = useMemo(() => [...new Set(data.map(d => d.band_posisi).filter(Boolean))].sort(), [data]);
            const unitOptions = useMemo(() => [...new Set(data.map(d => d.nama_unit).filter(Boolean))].sort(), [data]);
            const kinerjaOptions = useMemo(() => [...new Set(data.map(d => d.nilai_kinerja).filter(Boolean))].sort(), [data]);
            const kompetensiOptions = useMemo(() => [...new Set(data.map(d => d.nilai_kompetensi).filter(Boolean))].sort(), [data]);
            const behaviorOptions = useMemo(() => [...new Set(data.map(d => d.nilai_behavior).filter(Boolean))].sort(), [data]);
            const talentClusterOptions = useMemo(() => {
                const defaults = ['High Potential', 'Promotable', 'Potential 3', 'Potential 2', 'Potential 1', 'Belum Terpetakan'];
                const fromData = data
                    .map(d => String(d.talent_cluster || '').trim())
                    .filter(Boolean);
                return [...new Set([...defaults, ...fromData])];
            }, [data]);

            // Logic to convert raw P score into Talent Cluster badge based on 9-Box
            const getTalentClusterInfo = (p, k) => {
                // Bersihkan string (misal "P3" -> 3)
                const pVal = parseInt(String(p).replace(/\D/g, '')) || 9;
                const kVal = parseInt(String(k).replace(/\D/g, '')) || 9;

                // 1. High Potential (P <= 2 DAN K <= 2)
                if (pVal <= 2 && kVal <= 2) {
                    return { text: 'High Potential', type: 'success', level: 1 };
                }
                // 2. Promotable (P2K3 atau P3K2)
                if ((pVal === 2 && kVal === 3) || (pVal === 3 && kVal === 2)) {
                    return { text: 'Promotable', type: 'brand', level: 2 };
                }
                // 3. Potential 3 (P3K3)
                if (pVal === 3 && kVal === 3) {
                    return { text: 'Potential 3', type: 'warning', level: 3 };
                }
                // 4. Potential 2 (P3K4 atau P4K3)
                if ((pVal === 3 && kVal === 4) || (pVal === 4 && kVal === 3)) {
                    return { text: 'Potential 2', type: 'danger', level: 4 };
                }
                // 5. Potential 1 (P4K4, P5, atau K>=4 lainnya)
                if (pVal >= 4 || kVal >= 4 || pVal === 5) {
                    return { text: 'Potential 1', type: 'neutral', level: 5 };
                }

                return { text: 'Belum Terpetakan', type: 'neutral', level: 99 };
            };

            const getTalentClusterFromField = (raw) => {
                const val = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ');
                if (!val) return { text: '-', type: 'neutral', level: 99 };
                if (val === 'high potential' || val === 'hp' || val === 'potential high') return { text: 'High Potential', type: 'success', level: 1 };
                if (val === 'promotable' || val === 'promotable 1' || val === 'promotable 2') return { text: 'Promotable', type: 'brand', level: 2 };
                if (val === 'potential 3' || val === 'p3' || val === 'potential3') return { text: 'Potential 3', type: 'warning', level: 3 };
                if (val === 'potential 2' || val === 'p2' || val === 'potential2') return { text: 'Potential 2', type: 'danger', level: 4 };
                if (val === 'potential 1' || val === 'p1' || val === 'potential1') return { text: 'Potential 1', type: 'neutral', level: 5 };
                return { text: String(raw).trim(), type: 'neutral', level: 99 };
            };

            const getTalentClusterForEmp = (emp) => {
                // Hanya dari kolom talent_cluster
                return getTalentClusterFromField(emp?.talent_cluster);
            };

            const normalizeBand = (rawBand) => {
                // Hapus prefix 'BAND' dan 'BP' (case-insensitive), ambil bagian romawi/angka
                const cleaned = String(rawBand || '')
                    .toUpperCase()
                    .replace(/^\s*BAND\s*/i, '')   // hapus awalan 'BAND'
                    .replace(/^\s*BP\s*/i, '')     // hapus awalan 'BP'
                    .trim();
                const map = {
                    '1': 'I', '2': 'II', '3': 'III', '4': 'IV', '5': 'V', '6': 'VI',
                    'I': 'I', 'II': 'II', 'III': 'III', 'IV': 'IV', 'V': 'V', 'VI': 'VI'
                };
                return map[cleaned] || cleaned;
            };

            const parseScore = (val, prefix) => {
                const s = String(val || '').toUpperCase().trim();
                const m = s.match(new RegExp(`^${prefix}\\s*(\\d)$`));
                if (m) return Number(m[1]);
                const onlyNum = s.match(/^(\d)$/);
                if (onlyNum) return Number(onlyNum[1]);
                return null;
            };

            const checkEligibility = (emp, masaKerjaBulan) => {
                const cluster = getTalentClusterForEmp(emp);

                // === PASAL 16 AYAT 1a ===
                // Syarat minimum: P2K3 atau P3K2 -> hanya High Potential (level 1) dan Promotable (level 2)
                // Jika tidak ada TC (level 99), kita skip check ini
                if (cluster.level >= 3 && cluster.level !== 99) {
                    return {
                        eligible: false,
                        reason: `NOT ELIGIBLE&Pasal 16 (1a): ${cluster.text} tidak memenuhi min P2K3/P3K2`
                    };
                }

                // === VALIDASI DATA ===
                if (!emp.tgl_mulaikerja) {
                    return { eligible: false, reason: 'NOT ELIGIBLE&Tgl Mulai Kerja (Band Posisi) kosong' };
                }

                // === PASAL 16 AYAT 1b: Masa Kerja Berdasarkan Band Posisi ===
                let band = String(emp.band_posisi || '').toUpperCase().replace('BAND ', '').trim();
                const bandMap = { '1': 'I', '2': 'II', '3': 'III', '4': 'IV', '5': 'V', '6': 'VI' };
                if (bandMap[band]) band = bandMap[band];

                let minMonths = 0;
                let syaratTeks = '';

                if (['II', 'III', 'IV'].includes(band)) {
                    if (cluster.level === 1) { minMonths = 21; syaratTeks = '1 Thn 9 Bln'; }      // High Potential
                    else if (cluster.level === 2) { minMonths = 27; syaratTeks = '2 Thn 3 Bln'; } // Promotable
                    else if (cluster.level === 99) { minMonths = 33; syaratTeks = '2 Thn 9 Bln (Tanpa TC)'; } // Tanpa TC
                }
                else if (['V', 'VI'].includes(band)) {
                    if (cluster.level === 1) { minMonths = 24; syaratTeks = '2 Thn'; }             // High Potential
                    else if (cluster.level === 2) { minMonths = 30; syaratTeks = '2 Thn 6 Bln'; } // Promotable
                    else if (cluster.level === 99) { minMonths = 36; syaratTeks = '3 Thn (Tanpa TC)'; } // Tanpa TC
                }
                else {
                    return { eligible: false, reason: `NOT ELIGIBLE&Aturan untuk Band ${band || '?'} tidak tersedia` };
                }

                // === KOMPARASI MASA KERJA ===
                if (masaKerjaBulan < minMonths) {
                    return {
                        eligible: false,
                        reason: `NOT ELIGIBLE&Masa kerja ${masaKerjaBulan} bln, syarat ${cluster.text} BP ${band}: min ${syaratTeks}`
                    };
                }

                return {
                    eligible: true,
                    reason: `ELIGIBLE&${cluster.text} di BP ${band} telah memenuhi min ${syaratTeks}`
                };
            };

            const checkEligibilityEnhanced = (emp, masaKerjaBulan) => {
                const rawCluster = String(emp?.talent_cluster || '').trim();
                const pScore = parseScore(emp?.nilai_kinerja, 'P');
                const kScore = parseScore(emp?.nilai_kompetensi, 'K');

                // === PASAL 16 AYAT 1a: Gate P/K minimum ===
                // Syarat masuk: minimal P2K3 atau P3K2
                // (pScore lebih kecil = lebih baik: P1 terbaik, P3 batas bawah)
                if (pScore != null && kScore != null) {
                    const passPerf = (pScore <= 2 && kScore <= 3) || (pScore <= 3 && kScore <= 2);
                    if (!passPerf) {
                        return {
                            eligible: false,
                            reason: `NOT ELIGIBLE&Pasal 16 (1a): P${pScore}-K${kScore} tidak memenuhi min P2K3 atau P3K2`
                        };
                    }
                }

                // === Baca Talent Cluster dari kolom (berdiri sendiri) ===
                const cluster = getTalentClusterForEmp(emp);

                // Potential 1 (level 5) TIDAK eligible (tidak disebutkan dalam Pasal 16)
                if (cluster.level >= 5 && cluster.level !== 99) {
                    return {
                        eligible: false,
                        reason: `NOT ELIGIBLE&Pasal 16: ${cluster.text} tidak termasuk dalam ketentuan promosi`
                    };
                }

                // Jika tidak ada P/K, fallback ke talent_cluster:
                // Hanya High Potential & Promotable yang bisa tanpa data P/K
                if (pScore == null || kScore == null) {
                    if (cluster.level >= 3 && cluster.level !== 99) {
                        return {
                            eligible: false,
                            reason: `NOT ELIGIBLE&Nilai P/K tidak tersedia; ${cluster.text} memerlukan data P/K untuk validasi Pasal 16 (1a)`
                        };
                    }
                }

                // === VALIDASI TANGGAL ===
                if (!emp?.tgl_band_posisi) {
                    return {
                        eligible: false,
                        reason: 'NOT ELIGIBLE&Tanggal band posisi kosong, masa kerja band tidak dapat dihitung'
                    };
                }

                // === PASAL 16 AYAT 1b: Band Posisi & Masa Kerja ===
                const band = normalizeBand(emp?.band_posisi);
                if (!band) return { eligible: false, reason: 'NOT ELIGIBLE&Band posisi tidak ditemukan' };

                const isBand2to4 = ['II', 'III', 'IV'].includes(band);
                const isBand5to6 = ['V', 'VI'].includes(band);
                if (!isBand2to4 && !isBand5to6) {
                    return { eligible: false, reason: `NOT ELIGIBLE&Aturan promosi untuk BP ${band || '?'} belum tersedia` };
                }

                // === Tabel Syarat Masa Kerja (Pasal 16) ===
                // BP II-IV:
                //   High Potential   â†’ min 21 bln (1 Thn 9 Bln)
                //   Promotable       â†’ min 27 bln (2 Thn 3 Bln)
                //   Potential 3 & 2  â†’ min 33 bln (2 Thn 9 Bln)
                // BP V-VI:
                //   High Potential   â†’ min 24 bln (2 Thn)
                //   Promotable       â†’ min 30 bln (2 Thn 6 Bln)
                //   Potential 3 & 2  â†’ min 36 bln (3 Thn)
                let minMonths = 0;
                let syaratTeks = '';

                if (isBand2to4) {
                    if (cluster.level === 1) { minMonths = 21; syaratTeks = '1 Thn 9 Bln'; }  // High Potential
                    else if (cluster.level === 2) { minMonths = 27; syaratTeks = '2 Thn 3 Bln'; }  // Promotable
                    else if (cluster.level === 3 || cluster.level === 4 || cluster.level === 99) { minMonths = 33; syaratTeks = '2 Thn 9 Bln'; }  // Potential 3 & 2 / Tanpa TC
                    else return { eligible: false, reason: `NOT ELIGIBLE&${cluster.text} tidak termasuk ketentuan Pasal 16` };
                }
                if (isBand5to6) {
                    if (cluster.level === 1) { minMonths = 24; syaratTeks = '2 Thn'; }         // High Potential
                    else if (cluster.level === 2) { minMonths = 30; syaratTeks = '2 Thn 6 Bln'; }  // Promotable
                    else if (cluster.level === 3 || cluster.level === 4 || cluster.level === 99) { minMonths = 36; syaratTeks = '3 Thn'; }// Potential 3 & 2 / Tanpa TC
                    else return { eligible: false, reason: `NOT ELIGIBLE&${cluster.text} tidak termasuk ketentuan Pasal 16` };
                }

                // === KOMPARASI MASA KERJA ===
                if (masaKerjaBulan < minMonths) {
                    return {
                        eligible: false,
                        reason: `NOT ELIGIBLE&Masa kerja ${masaKerjaBulan} bln, syarat ${cluster.text} BP ${band}: min ${syaratTeks}`
                    };
                }

                return {
                    eligible: true,
                    reason: `ELIGIBLE&${cluster.text} di BP ${band} memenuhi syarat (min ${syaratTeks})`
                };
            };

            const dataWithEligibility = useMemo(() => {
                return data.map(d => {
                    const mk = calculateMasaKerja(d.tgl_band_posisi);
                    return { ...d, masaKerjaFormat: mk, eligibility: checkEligibilityEnhanced(d, mk.totalBulan) };
                });
            }, [data, nowTick]);

            const filteredData = useMemo(() => {
                const s = String(searchTerm).toLowerCase();
                return dataWithEligibility
                    .filter(emp => {
                        const matchSearch = !searchTerm ||
                            (emp.nama_karyawan && String(emp.nama_karyawan).toLowerCase().includes(s)) ||
                            (emp.nik && String(emp.nik).toLowerCase().includes(s));

                        const matchUnit = !filterUnit || String(emp.nama_unit) === filterUnit;
                        const matchKinerja = !filterKinerja || String(emp.nilai_kinerja) === filterKinerja;
                        const matchKompetensi = !filterKompetensi || String(emp.nilai_kompetensi) === filterKompetensi;
                        const matchBehavior = !filterBehavior || String(emp.nilai_behavior) === filterBehavior;
                        const matchTalentCluster = !filterTalentCluster || getTalentClusterForEmp(emp).text === filterTalentCluster;
                        const matchKelayakan = !filterKelayakan || (filterKelayakan === 'Lolos Syarat' ? emp.eligibility.eligible : !emp.eligibility.eligible);
                        const matchEligible = !filterEligible || emp.eligibility.eligible;

                        return matchSearch && matchBand && matchUnit && matchKinerja && matchKompetensi && matchBehavior && matchTalentCluster && matchKelayakan && matchEligible;
                    });
            }, [dataWithEligibility, searchTerm, filterBand, filterUnit, filterKinerja, filterKompetensi, filterBehavior, filterTalentCluster, filterKelayakan, filterEligible]);

            const filteredUsulan = useMemo(() => {
                if (!searchUsulan) return usulanData;

                    String(u.nama_karyawan || '').toLowerCase().includes(s) ||
                    String(u.nik || '').includes(searchUsulan)

            const fetchUsulanPromosi = () => {
                setIsLoadingUsulan(true);
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsLoadingUsulan(false);
                            try { const parsed = JSON.parse(res); setUsulanData(Array.isArray(parsed) ? parsed : []); } catch { setUsulanData([]); }
                        })

                        .getUsulanPromosiClient();
                } else {
                    setIsLoadingUsulan(false);
                    setUsulanData([]);
                }
            };

            useEffect(() => {
                fetchUsulanPromosi();
            }, []);

            // Set NIK yang sudah dalam proses usulan — dipakai untuk badge indikator di tabel
            const nikDalamProses = useMemo(() => {
                return new Set(usulanData.map(u => String(u.nik || '').trim()));
            }, [usulanData]);

            const handleExportExcel = () => {
                if (filteredData.length === 0) return alert("Tidak ada data untuk diekspor!");
                const exportData = filteredData.map((emp, index) => ({
                    'No': index + 1,
                    'NIK': emp.nik || '-',
                    'Nama Pegawai': emp.nama_karyawan || '-',
                    'Kinerja (P)': emp.nilai_kinerja || '-',
                    'Kompetensi (K)': emp.nilai_kompetensi || '-',
                    'Behavior (B)': emp.nilai_behavior || '-',
                    'Talent Cluster': getTalentClusterForEmp(emp).text,
                    'Masa Kerja Band': emp.masaKerjaFormat.teks,
                    'Kelayakan Promosi': emp.eligibility.eligible ? 'ELIGIBLE' : 'NOT ELIGIBLE',
                    'Alasan Kelayakan': emp.eligibility.reason.replace('&', ' - '),
                    'Jabatan': emp.nama_posisi || '-',
                    'Band Posisi': emp.band_posisi || '-',
                    'Unit Kerja': emp.nama_unit || '-'
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Promosi_Karyawan");
                XLSX.writeFile(wb, "Daftar_Promosi_Area3_TIF.xlsx", { bookType: "xlsx" });
            };

            const handleEditClick = (emp, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setSelectedEmp(emp);
                setUsulType('PROMOSI');
                setUsulPosisi(emp?.nama_posisi || '');
                setUsulUnit(emp?.nama_unit || '');
                setUsulBand(emp?.band_posisi || '');
                setUsulTalent(emp?.talent_cluster || '');
                setUsulKinerja(emp?.nilai_kinerja || '');
                setUsulKompetensi(emp?.nilai_kompetensi || '');
                setUsulBehavior(emp?.nilai_behavior || '');
                setUsulTglEfektif('');
                setUsulCatatan('');
                setIsModalOpen(true);
            };

            const handleSaveForm = (e) => {
                e.preventDefault();
                if (!selectedEmp) return;
                if (!String(usulPosisi || '').trim()) return alert("Posisi usulan wajib diisi.");
                setIsSaving(true);
                const payload = {
                    ...selectedEmp,
                    jenis_usulan: usulType,
                    posisi_awal: selectedEmp.nama_posisi || '-',
                    posisi_usulan: String(usulPosisi || '').trim(),
                    nama_unit: String(usulUnit || '').trim() || selectedEmp.nama_unit || '-',
                    unit_usulan: String(usulUnit || '').trim() || selectedEmp.nama_unit || '-',
                    band_posisi: String(usulBand || '').trim() || selectedEmp.band_posisi || '-',
                    talent_cluster: String(usulTalent || '').trim() || selectedEmp.talent_cluster || '-',
                    nilai_kinerja: String(usulKinerja || '').trim() || selectedEmp.nilai_kinerja || '-',
                    nilai_kompetensi: String(usulKompetensi || '').trim() || selectedEmp.nilai_kompetensi || '-',
                    nilai_behavior: String(usulBehavior || '').trim() || selectedEmp.nilai_behavior || '-',
                    tgl_posisi: String(usulTglEfektif || '').trim(),
                    mutasi: usulType === 'MUTASI' ? 'MUTASI' : '-',
                    catatan: usulCatatan || '-'
                };
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsSaving(false);
                            const parsed = JSON.parse(res);
                            if (parsed.error) alert("Gagal usulan: " + parsed.message);
                            else {
                                setIsModalOpen(false);
                                fetchUsulanPromosi();
                                onRefreshData();
                                alert("Usulan berhasil diajukan.");
                            }
                        })
                        .withFailureHandler((err) => { setIsSaving(false); alert("Error: " + err); })
                        .usulkanPromosiClient(payload);
                } else {
                    setIsSaving(false);
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleBulkUpdateFile = (e) => {
                const file = e.target.files[0]; if (!file) return; setIsUpdating(true); const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result; const wb = XLSX.read(bstr, { type: 'binary' }); const ws = wb.Sheets[wb.SheetNames[0]]; const jsonData = XLSX.utils.sheet_to_json(ws, { defval: "" });
                        if (jsonData.length === 0) { alert("File kosong."); setIsUpdating(false); return; }
                        if (typeof google !== 'undefined' && google.script) {
                            google.script.run.withSuccessHandler((res) => { setIsUpdating(false); const parsed = JSON.parse(res); if (parsed.error) alert("Gagal massal: " + parsed.message); else { alert("SUKSES"); onRefreshData(); } }).withFailureHandler((err) => { setIsUpdating(false); alert("Error: " + err); }).bulkUpdateClient(jsonData);
                        } else { setIsUpdating(false); alert("Live Environment req."); }
                    } catch (error) { setIsUpdating(false); alert("Gagal membaca format file."); }
                }; reader.readAsBinaryString(file); e.target.value = null;
            };

            const handleACCUsulan = (u) => {
                if (!confirm(`ACC usulan ${u.nama_karyawan}?\n\nMutasi: pindah ke sheet MUTASI & hapus dari DB_KARYAWAN.\nPromosi: update jabatan di DB_KARYAWAN.`)) return;
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            const parsed = JSON.parse(res);
                            if (parsed.error) alert("Gagal ACC: " + parsed.message);
                            else {
                                alert("✅ ACC berhasil.");
                                fetchUsulanPromosi();
                                onRefreshData();
                            }
                        })
                        .withFailureHandler((err) => alert("Error: " + err))
                        .accUsulanPromosiClient(u.nik);
                } else {
                    setUsulanData(prev => prev.filter(x => x.nik !== u.nik));
                }
            };

            const handleTolakUsulan = (u) => {
                if (!confirm(`Tolak usulan ${u.nama_karyawan}?`)) return;
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            const parsed = JSON.parse(res);
                            if (parsed.error) alert("Gagal: " + parsed.message);
                            else {
                                alert("Usulan ditolak.");
                                fetchUsulanPromosi();
                                onRefreshData();
                            }
                        })
                        .withFailureHandler((err) => alert("Error: " + err))
                        .tolakUsulanPromosiClient(u.nik);
                } else {
                    setUsulanData(prev => prev.filter(x => x.nik !== u.nik));
                }
            };

            if (isLoading) return <div className="p-8 text-slate-500">Memuat Matriks Promosi...</div>;

            return (
                <div className="fade-in space-y-6 pb-10">
                    <div className="flex justify-between items-center mb-2 gap-4 toolbar-scroll custom-scrollbar pb-2">
                        <div className="shrink-0">
                            <h1 className="text-2xl font-extrabold text-navy-900">Promotion & Transfer</h1>
                            <p className="text-sm text-slate-500">Analisis Kinerja (P), Kompetensi (K), dan Pemenuhan Syarat DJM.</p>
                        </div>
                        <div className="shrink-0 flex gap-3">
                            {activeTab === 'daftar' && (
                                <>
                                    <button onClick={() => setFilterEligible(!filterEligible)} className={`px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2 ${filterEligible ? 'bg-emerald-100 text-emerald-700 border border-emerald-300' : 'bg-white text-slate-600 border border-slate-200'}`}>
                                        <i className={`bx ${filterEligible ? 'bx-check-double' : 'bx-filter'}`}></i> Hanya Lolos Syarat
                                    </button>
                                    <button onClick={handleExportExcel} className="bg-navy-900 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-navy-800 transition flex items-center gap-2"><i className="bx bx-download text-lg"></i> Ekspor Excel</button>
                                </>
                            )}
                            {activeTab === 'riwayat' && (
                                <button onClick={fetchUsulanPromosi} className="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2">
                                    <i className={`bx ${isLoadingUsulan ? 'bx-loader-alt bx-spin' : 'bx-refresh'} text-lg`}></i> Refresh
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl w-fit border border-slate-200">
                        <button onClick={() => setActiveTab('daftar')} className={`px-5 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 ${activeTab === 'daftar' ? 'bg-white text-navy-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                            <i className="bx bx-list-ul"></i> Daftar Promosi & Transfer
                        </button>
                        <button onClick={() => setActiveTab('riwayat')} className={`px-5 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 ${activeTab === 'riwayat' ? 'bg-white text-navy-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                            <i className="bx bx-list-check"></i> Riwayat Usulan Promotion & Transfer
                            {usulanData.length > 0 && <span className="bg-violet-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full ml-1">{usulanData.length}</span>}
                        </button>
                    </div>

                    {false && (
                        <div>
                            <h2 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4"><i className="bx bxs-star text-amber-400 mr-2"></i>Top High Potential — Eligible for Promotion</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {topCandidates.map((emp, i) => (
                                    <div key={i} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative flex flex-col justify-between">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-4">
                                                <img src={`https://ui-avatars.com/api/?name=${String(emp.nama_karyawan || 'A').replace(/\s/g, '+')}&background=2563eb&color=fff`} className="w-12 h-12 rounded-full object-cover shadow-sm" alt="avt" />
                                                <div className="whitespace-normal min-w-[120px]">
                                                    <h3 className="font-bold text-navy-900 text-sm whitespace-normal leading-tight">{emp.nama_karyawan}</h3>
                                                    <div className="text-[10px] text-slate-500 font-mono mt-0.5">{emp.nik}</div>
                                                </div>
                                            </div>
                                            <button onClick={(e) => handleEditClick(emp, e)} className="p-2 bg-slate-100 hover:bg-brand-50 text-navy-900 hover:text-brand-600 rounded-lg transition"><i className="bx bx-edit text-xl"></i></button>
                                        </div>
                                        <div className="flex justify-between items-center mt-4 pt-4 border-t border-slate-100">
                                            <div className="flex flex-col gap-1 text-[10px] font-bold font-mono">
                                                <div className="flex gap-2">
                                                    <span className="text-emerald-700 bg-emerald-100 px-2 py-1 rounded" title="Kinerja">P: {emp.nilai_kinerja || '-'}</span>
                                                    <span className="text-blue-700 bg-blue-100 px-2 py-1 rounded" title="Kompetensi">K: {emp.nilai_kompetensi || '-'}</span>
                                                </div>
                                                <span className="text-slate-500 mt-1"><i className="bx bx-time-five text-xs translate-y-px"></i> {emp.masaKerjaFormat.teks}</span>
                                            </div>
