                                                                    <div className="text-[11px] font-bold text-emerald-600">Mulai: {formatDateDMY(emp.tgl_mulaikerja)}</div>
                                                                    <div className="text-[11px] font-bold text-red-500 mt-0.5">Pensiun: {formatDateDMY(emp.tgl_pensiun)}</div>
                                                                </td>
                                                                <td className="px-3 py-2 text-center">
                                                                    <span className={`px-3 py-1 rounded-full text-[11px] font-bold tracking-wide border shadow-sm font-mono ${emp.sisaHari <= 365 ? 'bg-amber-100 text-amber-700 border-amber-200' : emp.sisaHari <= 1095 ? 'bg-brand-100 text-brand-700 border-brand-200' : emp.sisaHari <= 0 ? 'bg-red-100 text-red-700 border-red-200' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                                                                        <i className="bx bx-time-five mr-1"></i> {emp.countdown}
                                                                    </span>
                                                                </td>
                                                                <td className="px-3 py-2 text-center"><Badge text={emp.statusLabel} type={emp.badgeType} /></td>
                                                            </tr>
                                                        ))}
                                                        {detailModal.list.length === 0 && (<tr><td colSpan="5" className="text-center py-10 text-slate-400 font-medium">Tidak ada data untuk kategori ini.</td></tr>)}
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div className="p-5 border-t border-slate-200/50 bg-slate-50/50 flex justify-end shrink-0">
                                                <button onClick={() => setDetailModal(null)} className="px-6 py-2.5 bg-navy-900 hover:bg-navy-800 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                                                    <i className="bx bx-check-circle text-lg"></i> Tutup Panel
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}

                    {/* Pop-up Info Panduan Upload CSV */}
                    {isUploadInfoOpen && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[200] overflow-y-auto custom-scrollbar">
                                <div className="fixed inset-0 bg-slate-900/60 transition-opacity cursor-pointer" onClick={() => setIsUploadInfoOpen(false)}></div>
                                <div className="flex min-h-full items-center justify-center p-4 sm:p-6 pointer-events-none transition-all duration-300">
                                    <div className={getModalFrameClass('full')}>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[80%] bg-gradient-to-r from-emerald-500/40 to-teal-500/40 blur-[100px] rounded-[100%] ambient-glow pointer-events-none"></div>
                                        <div className={modalPanelClass} onClick={(e) => e.stopPropagation()}>
                                            <div className="p-6 border-b border-slate-200/50 bg-gradient-to-r from-slate-50 to-white flex justify-between items-center shrink-0">
                                                <div>
                                                    <h2 className="text-xl font-extrabold text-navy-900">Panduan Upload Manajemen Pensiun</h2>
                                                    <p className="text-xs text-slate-500 mt-1">Pastikan format header Excel/CSV persis sesuai dengan label di bawah ini.</p>
                                                </div>
                                                <button onClick={() => setIsUploadInfoOpen(false)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 hover:rotate-90 transition-all duration-300"><i className="bx bx-x text-2xl"></i></button>
                                            </div>
                                            <div className={`${modalBodyPaddedScrollClass} space-y-5`}>
                                                <div className="bg-amber-50 p-5 rounded-2xl border border-amber-200 w-full">
                                                    <h3 className="text-sm font-bold text-amber-800 mb-4"><i className="bx bx-info-circle mr-1"></i> Kolom Utama yang Dibutuhkan (Format Horizontal):</h3>
                                                    <div className="w-full overflow-x-auto custom-scrollbar pb-3">
                                                        <div className="flex flex-row flex-nowrap gap-3 items-center w-max">
                                                            {['NIK', 'Nama Pegawai', 'Usia Saat Ini', 'Status Pegawai', 'Tgl Mulai Kerja', 'Tgl Pensiun', 'Jabatan', 'Unit Kerja'].map(col => (
                                                                <span key={col} className="shrink-0 px-4 py-2 bg-white border border-amber-200 text-amber-700 text-xs font-mono font-bold rounded-lg shadow-sm whitespace-nowrap">{col}</span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="bg-blue-50 p-5 rounded-2xl border border-blue-200">
                                                    <p className="text-sm text-blue-800 leading-relaxed font-medium">
                                                        <i className="bx bx-bulb text-xl inline-block align-middle mr-2"></i> <b>Tips Aman:</b> Klik <b>Ekspor Excel</b> terlebih dahulu, edit dari file tersebut, lalu gunakan sebagai template untuk diunggah kembali.
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="p-5 border-t border-slate-200/50 bg-slate-50/50 flex justify-end gap-3 shrink-0">
                                                <button onClick={() => setIsUploadInfoOpen(false)} className="px-6 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">Batal</button>
                                                <button onClick={() => { setIsUploadInfoOpen(false); fileUploadRef.current.click(); }} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                                                    <i className="bx bx-upload text-xl"></i> Lanjutkan Pilih File
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}

                    {/* Pop-up Edit Modal Pensiun */}
                    {isEditOpen && editData && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[200] overflow-y-auto custom-scrollbar">
                                <div className="fixed inset-0 bg-slate-900/60 transition-opacity cursor-pointer" onClick={() => setIsEditOpen(false)}></div>
                                <div className="flex min-h-full items-center justify-center p-4 sm:p-6 pointer-events-none transition-all duration-300">
                                    <div className={getModalFrameClass('default')}>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[80%] bg-gradient-to-r from-brand-500/40 to-blue-500/40 blur-[100px] rounded-[100%] ambient-glow pointer-events-none"></div>
                                        <div className={modalPanelClass} onClick={(e) => e.stopPropagation()}>
                                            <div className="p-6 border-b border-slate-200/50 bg-gradient-to-r from-slate-50 to-white flex justify-between items-center shrink-0">
                                                <div><h2 className="text-lg font-bold text-navy-900">Edit Info Pensiun</h2><p className="text-xs text-slate-500 mt-1">Sesuaikan usia dan tanggal Pegawai</p></div>
                                                <button onClick={() => setIsEditOpen(false)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 hover:rotate-90 transition-all duration-300"><i className="bx bx-x text-2xl"></i></button>
                                            </div>
                                            <form onSubmit={saveEdit} className={`${modalBodyPaddedScrollClass} space-y-4`}>
                                                <div className="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4 mb-2 shadow-sm">
                                                    <div className="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-xl shadow-inner"><i className="bx bxs-user-circle"></i></div>
                                                    <div><div className="font-bold text-navy-900">{editData.nama_karyawan}</div><div className="text-[10px] text-brand-600 font-bold uppercase mt-0.5">NIK: {editData.nik}</div></div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Usia Saat Ini (Tahun)</label><input type="number" required value={editData.usia || ''} onChange={(e) => setEditData({ ...editData, usia: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" /></div>
                                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Status Pegawai</label><select value={editData.nama_employee_group || 'Aktif'} onChange={(e) => setEditData({ ...editData, nama_employee_group: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white"><option value="Aktif">Aktif</option><option value="Pensiun">Pensiun</option><option value="Dalam Proses Pensiun">Dalam Proses Pensiun</option></select></div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4 mt-4">
                                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Tgl Mulai Kerja</label><input type="date" value={editData.tgl_mulaikerja || ''} onChange={(e) => setEditData({ ...editData, tgl_mulaikerja: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" /></div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">Tgl Pensiun</label>
                                                        <input type="date" value={editData.tgl_pensiun || ''} onChange={(e) => setEditData({ ...editData, tgl_pensiun: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none mb-2 bg-white" />
                                                        <button type="button" onClick={handleAutoSetPensiun} className="w-full bg-slate-800 text-white py-2 rounded-xl text-xs font-bold hover:bg-navy-900 shadow-md transition flex items-center justify-center gap-1"><i className="bx bx-calculator"></i> Set Pensiun (55 Thn)</button>
                                                    </div>
                                                </div>
                                                <div className="pt-5 flex justify-end gap-3 border-t border-slate-200/50 mt-4">
                                                    <button type="button" onClick={() => setIsEditOpen(false)} className="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">Batal</button>
                                                    <button type="submit" disabled={isSaving} className={`px-6 py-2.5 text-sm font-bold text-white rounded-xl transition shadow-md hover:shadow-lg ${isSaving ? 'bg-brand-400' : 'bg-brand-600 hover:bg-brand-700'}`}>
                                                        {isSaving ? <i className="bx bx-loader-alt bx-spin mr-1"></i> : null} {isSaving ? 'Menyimpan...' : 'Simpan Data'}
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </div>
            );
        };
        // 6. MANAJEMEN MAGANG
        const MagangView = ({ dataMagang, karyawanData, isLoading, onRefresh }) => {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isUploadInfoOpen, setIsUploadInfoOpen] = useState(false);
            const [formData, setFormData] = useState({
                id_magang: '', timestamp: '', email: '', no_telepon: '', nama: '', nim: '',
                jenjang_pendidikan: 'D3', jurusan: '', asal_kampus: '',
                tanggal_mulai: '', tanggal_selesai: '', durasi: '',
                unit_tujuan: '', mentor: '', proposal: '', cv: '', surat_pengantar: '', status: 'Belum',
                surat_dinas_mentor: '', keterangan_selesai: '', file_sertifikat: ''
            });
            const [isSaving, setIsSaving] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const fileInputRef = useRef(null);
            const [isUploading, setIsUploading] = useState(false);
            const [clickPos, setClickPos] = useState({ x: null, y: null });

            const handleSyncFromForm = () => {
                if (!confirm('Sinkronisasi data dari Form Responses 1 ke DB_MAGANG?\n\nData baru dari Google Form akan ditarik masuk ke DB_MAGANG. Data yang sudah ada akan diperbarui dari Form.\nData yang sudah Anda edit manual di web tidak akan tertimpa.')) return;
                setIsSyncing(true);
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsSyncing(false);
                            let parsed = {};
                            try { parsed = JSON.parse(res); } catch (_) { parsed = {}; }
                            if (parsed.error) return alert('Gagal sinkronisasi: ' + parsed.message);
                            alert(' ' + (parsed.message || 'Sinkronisasi selesai!'));
                            onRefresh();
                        })
                        .withFailureHandler((err) => { setIsSyncing(false); alert('Error: ' + err); })
                        .pullMagangFromExternalClient();
                } else {
                    setIsSyncing(false);
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const divisiList = useMemo(() => {
                if (!Array.isArray(karyawanData)) return [];
                const units = karyawanData.map(emp => emp.unit_2 || emp.nama_unit).filter(Boolean);
                return [...new Set(units)].sort();
            }, [karyawanData]);

            const calculateDurationInMonths = (startStr, endStr) => {
                if (!startStr || !endStr) return '';
                const d1 = parseDateStringSafe(startStr);
                const d2 = parseDateStringSafe(endStr);
                if (!d1 || !d2) return '';

                const diffTime = d2.getTime() - d1.getTime();
                if (diffTime < 0) return '0';
                const diffDays = diffTime / (1000 * 3600 * 24);
                const diffMonths = Math.round(diffDays / 30.44);
                return diffMonths === 0 ? '1' : diffMonths.toString();
            };

            const calculateAutoStatus = (startStr, endStr, manualStatus) => {
                if (!startStr || !endStr) return manualStatus || 'Belum';
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const startDate = parseDateStringSafe(startStr);
                const endDate = parseDateStringSafe(endStr);

                if (!startDate || !endDate) return manualStatus || 'Belum';

                startDate.setHours(0, 0, 0, 0);
                endDate.setHours(23, 59, 59, 999);

                if (today < startDate) return 'Belum';
                if (today > endDate) return 'Selesai';
                return 'Aktif';
            };

            const normalizeMagangItem = (intern = {}) => ({
                ...intern,
                asal_kampus: intern.asal_kampus || intern.universitas || '',
                unit_tujuan: intern.unit_tujuan || intern.divisi || intern.penempatan_unit_divisi || '',
                nomor_hp: intern.nomor_hp || intern.no_telepon || intern.no_hp || intern.telepon || ''
            });

            const safeMagangData = useMemo(() => {
                return Array.isArray(dataMagang) ? dataMagang.map(normalizeMagangItem) : [];
            }, [dataMagang]);

            const processedMagangData = useMemo(() => {
                return safeMagangData.map(intern => {
                    const autoStatus = calculateAutoStatus(intern.tanggal_mulai, intern.tanggal_selesai, intern.status);
                    return { ...intern, status: autoStatus };
                });
            }, [safeMagangData]);

            const filteredData = processedMagangData.filter(intern => {
                const s = String(searchTerm).toLowerCase();
                return !searchTerm ||
                    (intern.nama && String(intern.nama).toLowerCase().includes(s)) ||
                    (intern.nim && String(intern.nim).toLowerCase().includes(s)) ||
                    (intern.asal_kampus && String(intern.asal_kampus).toLowerCase().includes(s)) ||
                    (intern.unit_tujuan && String(intern.unit_tujuan).toLowerCase().includes(s)) ||
                    (intern.jurusan && String(intern.jurusan).toLowerCase().includes(s));
            });

            const handleExportExcel = () => {
                if (filteredData.length === 0) return alert("Tidak ada data untuk diekspor!");
                const exportData = filteredData.map((intern, index) => ({
                    'No': index + 1,
                    'ID / NIK Magang': intern.id_magang || '-',
                    'Nama Peserta': intern.nama || '-',
                    'Email': intern.email || '-',
                    'No Telepon': intern.no_telepon || intern.telepon || intern.no_hp || '-',
                    'Pendidikan/Jurusan': intern.jurusan || '-',
                    'Asal Instansi/Universitas': intern.universitas || intern.asal_kampus || '-',
                    'Lama Waktu': intern.lama_magang || intern.durasi || '-',
                    'Penempatan Unit/Divisi': intern.divisi || intern.unit_tujuan || '-',
                    'Mentor': intern.mentor || '-',
                    'Link Proposal': intern.proposal || '-',
                    'Link CV': intern.cv || '-',
                    'Link Surat Pengantar': intern.surat_pengantar || '-',
                    'Link Surat Dinas Mentor': intern.surat_dinas_mentor || '-',
                    'Link Surat Selesai': intern.keterangan_selesai || '-',
                    'Link Sertifikat': intern.file_sertifikat || '-',
                    'Status': intern.status || '-'
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Daftar_Magang");
                XLSX.writeFile(wb, "Data_Peserta_Magang_Area3.xlsx", { bookType: "xlsx" });
            };

            const handleAdd = (e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setFormData({
                    id_magang: '', timestamp: formatDateLongID(new Date()), email: '', no_telepon: '', nama: '', nim: '',
                    jenjang_pendidikan: 'D3', jurusan: '', asal_kampus: '',
                    tanggal_mulai: '', tanggal_selesai: '', durasi: '3 Bulan',
                    unit_tujuan: '', mentor: '', proposal: '', cv: '', surat_pengantar: '', status: 'Belum',
                    surat_dinas_mentor: '', keterangan_selesai: '', file_sertifikat: ''
                });
                setIsModalOpen(true);
            };

            const handleEdit = (intern, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                const dMulai = parseDateStringSafe(intern.tanggal_mulai);
                const dSelesai = parseDateStringSafe(intern.tanggal_selesai);

                let cleanDurasi = intern.durasi || intern.lama_magang || '';
                cleanDurasi = String(cleanDurasi).replace(/Bulan/gi, '').trim();

                setFormData({
                    id_magang: intern.id_magang, timestamp: intern.timestamp || '', email: intern.email || '',
                    no_telepon: intern.no_telepon || intern.nomor_hp || intern.telepon || intern.no_hp || intern['No Telepon'] || '',
                    nama: intern.nama || '', nim: intern.nim || '',
                    jenjang_pendidikan: intern.jenjang_pendidikan || 'D3', jurusan: intern.jurusan || '',
                    asal_kampus: intern.asal_kampus || intern.universitas || '',
                    tanggal_mulai: dMulai ? getFormattedDateYMD(dMulai) : '',
                    tanggal_selesai: dSelesai ? getFormattedDateYMD(dSelesai) : '',
                    durasi: cleanDurasi,
                    unit_tujuan: intern.unit_tujuan || intern.divisi || intern.penempatan_unit_divisi || '',
                    mentor: intern.mentor || '',
                    proposal: intern.proposal || '',
                    cv: intern.cv || '',
                    surat_pengantar: intern.surat_pengantar || '', status: intern.status || 'Belum',
                    surat_dinas_mentor: intern.surat_dinas_mentor || '', keterangan_selesai: intern.keterangan_selesai || '',
                    file_sertifikat: intern.file_sertifikat || ''
                });
                setIsModalOpen(true);
            };

            useEffect(() => {
                if (isModalOpen && formData.tanggal_mulai && formData.tanggal_selesai) {
                    const newStatus = calculateAutoStatus(formData.tanggal_mulai, formData.tanggal_selesai, formData.status);
                    const newDurasi = calculateDurationInMonths(formData.tanggal_mulai, formData.tanggal_selesai);

                    if (newStatus !== formData.status || newDurasi !== formData.durasi) {
                        setFormData(prev => ({ ...prev, status: newStatus, durasi: newDurasi }));
                    }
                }
            }, [formData.tanggal_mulai, formData.tanggal_selesai]);

            const handleDelete = (id) => {
                if (!confirm("Hapus data magang ini?")) return;
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            let parsed = {};
                            try { parsed = JSON.parse(res); } catch (_) { parsed = {}; }
                            if (parsed.error) return alert("Gagal hapus: " + parsed.message);
                            onRefresh();
                        })
                        .withFailureHandler((err) => alert("Error: " + err))
                        .deleteMagangClient(id);
                } else {
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleSave = (e) => {
                e.preventDefault(); setIsSaving(true);

                let finalDurasi = formData.durasi;
                if (finalDurasi && !String(finalDurasi).toLowerCase().includes('bulan')) {
                    finalDurasi = `${finalDurasi} Bulan`;
                }

                const payloadToSave = {
                    ...formData,
                    durasi: finalDurasi
                };

                if (isSpreadsheetRuntimeReady()) {
                    if (formData.id_magang) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                let parsed = {};
                                try { parsed = JSON.parse(res); } catch (_) { parsed = {}; }
                                if (parsed.error) { setIsSaving(false); return alert("Gagal update: " + parsed.message); }
                                setIsSaving(false); setIsModalOpen(false); onRefresh();
                            })
                            .withFailureHandler((err) => { setIsSaving(false); alert("Error: " + err); })
                            .updateMagangClient(payloadToSave);
                    } else {
                        google.script.run
                            .withSuccessHandler((res) => {
                                let parsed = {};
                                try { parsed = JSON.parse(res); } catch (_) { parsed = {}; }
                                if (parsed.error) { setIsSaving(false); return alert("Gagal simpan: " + parsed.message); }
                                setIsSaving(false); setIsModalOpen(false); onRefresh();
                            })
                            .withFailureHandler((err) => { setIsSaving(false); alert("Error: " + err); })
                            .saveMagangClient(payloadToSave);
                    }
                } else {
                    setIsSaving(false);
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rawData = XLSX.utils.sheet_to_json(ws, { defval: "" });

                        if (rawData.length === 0) { alert("File kosong atau format salah."); setIsUploading(false); return; }

                        const formattedData = rawData.map(row => ({
                            timestamp: row['Timestamp'] || row['timestamp'] || formatDateLongID(new Date()),
                            email: row['Email'] || row['email'] || '',
                            no_telepon: row['no_telepon'] || row['No Telepon'] || row['no telepon'] || row['No HP'] || row['no hp'] || row['Telepon'] || row['telepon'] || '',
                            nama: row['Nama Lengkap'] || row['Nama Peserta'] || row['nama'] || '',
                            nim: row['NIM'] || row['nim'] || '',
                            jenjang_pendidikan: row['Jenjang Pendidikan'] || row['jenjang'] || 'D3',
                            jurusan: row['Jurusan'] || row['jurusan'] || '',
                            asal_kampus: row['Asal Instansi/Universitas'] || row['Asal Kampus'] || row['Universitas'] || '',
                            tanggal_mulai: row['Tanggal Mulai'] || '',
                            tanggal_selesai: row['Tanggal Selesai'] || '',
                            durasi: row['Durasi (Bulan)'] || row['Lama Waktu'] || '',
                            unit_tujuan: row['Unit Tujuan'] || row['Penempatan Unit/Divisi'] || '',
                            mentor: row['Mentor'] || row['mentor'] || '',
                            proposal: row['Link Proposal'] || '',
                            cv: row['Link CV'] || row['CV'] || row['cv'] || row['Daftar Riwayat Hidup'] || row['CV/ DAFTAR RIWAYAT HIDUP'] || '',
                            surat_pengantar: row['Link Surat Pengantar'] || '',
                            surat_dinas_mentor: row['Link Surat Dinas Mentor'] || '',
                            keterangan_selesai: row['Keterangan Selesai'] || row['Surat Selesai'] || '',
                            file_sertifikat: row['Link Sertifikat'] || row['File Sertifikat'] || row['Sertifikat'] || '',
                            status: row['Status'] || 'Aktif'
                        }));

                        if (typeof google !== 'undefined' && google.script) {
                            google.script.run
                                .withSuccessHandler((res) => {
                                    setIsUploading(false);
                                    const parsed = JSON.parse(res);
                                    if (parsed.error) alert("Gagal update massal: " + parsed.message);
                                    else { alert("SUKSES! Data magang berhasil diupload ke DB_MAGANG."); onRefresh(); }
                                })
                                .withFailureHandler((err) => { setIsUploading(false); alert("Error Server: " + err); })
                                .bulkImportMagangClient(formattedData);
                        } else {
                            setIsUploading(false); alert("Mode lokal: Upload simulasi massal berhasil.");
                        }
                    } catch (error) { setIsUploading(false); alert("Gagal membaca file CSV/Excel."); }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            if (isLoading) return <div className="p-8 text-slate-500">Memuat Data Magang External...</div>;

            return (
                <div className="fade-in space-y-6 pb-10">
                    <div className="flex justify-between items-center mb-2 gap-4 toolbar-scroll custom-scrollbar pb-2">
                        <div className="shrink-0">
                            <h1 className="text-2xl font-extrabold text-navy-900">Internship</h1>
                            <p className="text-sm text-slate-500">Mahasiswa magang dihubungkan ke spreadsheet <b>DB_MAGANG</b>.</p>
                        </div>
                        <div className="shrink-0 flex gap-2">
                            <input type="file" accept=".csv, .xlsx" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                            <button
                                onClick={handleSyncFromForm}
                                disabled={isSyncing}
                                title="Tarik data baru dari Google Form (Form Responses 1) ke DB_MAGANG"
                                className={`text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2 ${isSyncing ? 'bg-violet-400 cursor-wait' : 'bg-violet-600 hover:bg-violet-700'
                                    }`}>
                                <i className={`bx ${isSyncing ? 'bx-loader-alt bx-spin' : 'bx-sync'} text-lg`}></i>
                                {isSyncing ? 'Menyinkronkan...' : 'Sync dari Form'}
                            </button>
                            <button onClick={(e) => { setClickPos({ x: e.clientX, y: e.clientY }); setIsUploadInfoOpen(true); }} disabled={isUploading} className={`bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-emerald-700 transition flex items-center gap-2`}><i className={`bx ${isUploading ? 'bx-loader-alt bx-spin' : 'bx-upload'} text-lg`}></i> {isUploading ? 'Upload...' : 'Upload Data'}</button>
                            <button onClick={handleExportExcel} className="bg-navy-900 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-navy-800 transition flex items-center gap-2"><i className="bx bx-download text-lg"></i> Ekspor Excel</button>
                            <button onClick={(e) => handleAdd(e)} className="bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-brand-700 transition flex items-center gap-2"><i className="bx bx-plus text-lg"></i> Tambah Peserta</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="p-4 border-b border-slate-200 bg-slate-50 flex items-center toolbar-scroll custom-scrollbar pb-3">
                            <div className="relative min-w-[250px] shrink-0">
                                <i className="bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" placeholder="Cari Nama / NIM / Kampus / Unit..." className="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-brand-500 shadow-sm bg-white" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left text-xs whitespace-nowrap min-w-[1700px]">
                                <thead className="bg-white text-slate-500 text-[11px] uppercase tracking-wider font-bold sticky top-0 z-10 shadow-sm border-b border-slate-200">
                                    <tr>
                                        <th className="px-3 py-2.5 w-44">Info Kontak</th>
                                        <th className="px-3 py-2.5 w-52">Peserta</th>
                                        <th className="px-3 py-2.5 w-56">Pendidikan & Kampus</th>
                                        <th className="px-3 py-2.5 text-center">Waktu</th>
                                        <th className="px-3 py-2.5 w-52">Unit & Mentor</th>
                                        <th className="px-3 py-2.5 text-center">Proposal</th>
                                        <th className="px-3 py-2.5 text-center">CV</th>
                                        <th className="px-3 py-2.5 text-center">Surat Pengantar</th>
                                        <th className="px-3 py-2.5 text-center">Surat Dinas Mentor</th>
                                        <th className="px-3 py-2.5 text-center">Selesai & Sertifikat</th>
                                        <th className="px-3 py-2.5 text-center">Status</th>
                                        <th className="px-3 py-2.5 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-slate-700">
                                    {filteredData.length === 0 ? (<tr><td colSpan="12" className="text-center py-10 text-slate-400 font-medium">Belum ada data peserta magang di database magang.</td></tr>) :
                                        filteredData.map((intern, i) => (
                                            <tr key={i} className="hover:bg-slate-50 transition cursor-default">
                                                <td className="px-3 py-2 whitespace-normal min-w-[180px]">
                                                    <div className="text-[10px] text-slate-500 font-semibold">{formatDateLongID(intern.timestamp)}</div>
                                                    <div className="text-xs font-semibold text-slate-800 mt-1 whitespace-normal break-all leading-tight min-w-[150px]"><i className="bx bx-envelope mr-1"></i>{intern.email || '-'}</div>
                                                    <div className="text-xs font-semibold text-slate-800 mt-1 whitespace-normal break-all leading-tight"><i className="bx bx-phone mr-1"></i>{intern.no_telepon || intern.telepon || intern.no_hp || '-'}</div>
                                                </td>
                                                <td className="px-3 py-2 whitespace-normal min-w-[180px]">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 shrink-0"><i className="bx bxs-user"></i></div>
                                                        <div>
                                                            <div className="font-bold text-navy-900 whitespace-normal leading-tight min-w-[150px]">{intern.nama || '-'}</div>
                                                            <div className="text-[10px] text-brand-600 font-bold font-mono mt-1">NIM: {intern.nim || '-'}</div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="px-3 py-2 whitespace-normal min-w-[220px]">
                                                    <div className="font-semibold text-slate-800 whitespace-normal leading-tight min-w-[200px]">{intern.jenjang_pendidikan || '-'} - {intern.jurusan || '-'}</div>
                                                    <div className="text-[10px] text-slate-500 font-bold uppercase mt-1 whitespace-normal leading-tight"><i className="bx bxs-bank mr-1"></i>{intern.asal_kampus || '-'}</div>
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    <div className="text-[11px] font-bold text-emerald-600">

                                                    <div className="text-[10px] text-slate-500 font-mono mt-0.5"><span className="px-2 py-1 bg-slate-100 text-slate-600 rounded font-semibold text-xs border border-slate-200">{intern.durasi || '-'}</span></div>

                                                    <div className="text-[11px] font-bold text-slate-600 uppercase whitespace-normal leading-tight min-w-[200px]" title={intern.unit_tujuan || intern.divisi}>

                                                    <div className="text-[10px] text-slate-500 mt-1 font-medium whitespace-normal leading-tight" title={intern.mentor}>
                                                        <i className="bx bx-user mr-1"></i> {intern.mentor || 'Belum ada mentor'}
                                                    </div>
                                                </td>
                                                <td className="px-3 py-2 text-center">

                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    {intern.cv && intern.cv !== '-' ? <a href={intern.cv} target="_blank" className="text-[10px] bg-cyan-50 text-cyan-600 px-3 py-1.5 rounded-md font-bold hover:bg-cyan-100 transition whitespace-normal text-center leading-tight w-full inline-block shadow-sm"><i className="bx bx-link"></i> CV</a> : <button onClick={(e) => handleEdit(intern, e)} className="text-[10px] bg-slate-50 text-slate-500 px-3 py-1.5 rounded-md font-bold hover:bg-slate-100 transition border border-slate-200 inline-flex items-center justify-center gap-1 shadow-sm w-full"><i className="bx bx-upload"></i> Upload</button>}
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    {intern.surat_pengantar && intern.surat_pengantar !== '-' ? <a href={intern.surat_pengantar} target="_blank" className="text-[10px] bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-md font-bold hover:bg-indigo-100 transition whitespace-normal text-center leading-tight w-full inline-block shadow-sm"><i className="bx bx-link"></i> Pengantar</a> : <button onClick={(e) => handleEdit(intern, e)} className="text-[10px] bg-slate-50 text-slate-500 px-3 py-1.5 rounded-md font-bold hover:bg-slate-100 transition border border-slate-200 inline-flex items-center justify-center gap-1 shadow-sm w-full"><i className="bx bx-upload"></i> Upload</button>}
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    {intern.surat_dinas_mentor && intern.surat_dinas_mentor !== '-' ? (
                                                        <a href={intern.surat_dinas_mentor} target="_blank" className="text-[10px] bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-md font-bold hover:bg-emerald-100 transition whitespace-normal text-center leading-tight w-full inline-block inline-flex items-center justify-center gap-1"><i className="bx bx-file"></i> Surat Dinas</a>
                                                    ) : (
                                                        <button onClick={(e) => handleEdit(intern, e)} className="text-[10px] bg-amber-50 text-amber-600 px-3 py-1.5 rounded-md font-bold hover:bg-amber-100 transition border border-amber-200 inline-flex items-center justify-center gap-1 shadow-sm"><i className="bx bx-upload"></i> Upload</button>
                                                    )}
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    <div className="flex flex-col items-center justify-center gap-1.5">
                                                        {intern.keterangan_selesai && intern.keterangan_selesai !== '-' ? (
                                                            <a href={intern.keterangan_selesai} target="_blank" className="text-[10px] bg-emerald-50 text-emerald-600 px-3 py-1 rounded-md font-bold hover:bg-emerald-100 transition whitespace-normal text-center leading-tight w-full inline-block"><i className="bx bx-file"></i> Surat Selesai</a>
                                                        ) : (
                                                            <span className="text-[10px] text-slate-400">Tak ada surat</span>
                                                        )}
                                                        {intern.file_sertifikat && intern.file_sertifikat !== '-' ? (
                                                            <a href={intern.file_sertifikat} target="_blank" className="text-[10px] bg-amber-50 text-amber-600 px-3 py-1 rounded-md font-bold hover:bg-amber-100 transition whitespace-normal text-center leading-tight w-full inline-block"><i className="bx bx-award"></i> Sertifikat</a>
                                                        ) : (
                                                            <button onClick={(e) => handleEdit(intern, e)} className="text-[10px] bg-slate-50 text-slate-500 px-3 py-1 rounded-md font-bold hover:bg-slate-100 transition border border-slate-200 inline-flex items-center justify-center gap-1 shadow-sm w-full"><i className="bx bx-upload"></i> Upload</button>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    <Badge text={intern.status} type={intern.status === 'Aktif' ? 'brand' : intern.status === 'Selesai' ? 'success' : intern.status === 'Belum' ? 'warning' : 'danger'} />
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    <div className="flex gap-2 justify-center">
                                                        <button onClick={(e) => handleEdit(intern, e)} className="p-2 bg-slate-100 hover:bg-brand-50 text-navy-900 text-xs font-bold rounded-lg transition" title="Edit"><i className="bx bx-edit text-brand-600 text-base"></i></button>
                                                        <button onClick={() => handleDelete(intern.id_magang)} className="p-2 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-lg transition" title="Hapus"><i className="bx bx-trash text-base"></i></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 border-t border-slate-200 bg-slate-50 text-xs text-slate-500 font-medium flex justify-between items-center">
                            <span>Menampilkan {filteredData.length} data peserta magang</span>
                        </div>
                    </div>

                    {/* Pop-up Info Panduan Upload CSV Magang */}
                    {isUploadInfoOpen && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[200] overflow-y-auto custom-scrollbar">
                                <div className="fixed inset-0 bg-slate-900/60 transition-opacity cursor-pointer pointer-events-auto" onClick={() => setIsUploadInfoOpen(false)}></div>

                                <div
                                    className="flex min-h-full items-center justify-center p-4 sm:p-6 pointer-events-none transition-all duration-300"
                                >
                                    <div className={getModalFrameClass('full')}>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[80%] bg-gradient-to-r from-emerald-500/40 to-teal-500/40 blur-[100px] rounded-[100%] ambient-glow pointer-events-none"></div>

                                        <div className={`${modalPanelClass} pointer-events-auto`} onClick={(e) => e.stopPropagation()}>

                                                <div>
                                                    <h2 className="text-xl font-extrabold text-navy-900">Panduan Upload Data Peserta Magang</h2>
                                                    <p className="text-xs text-slate-500 mt-1">Pastikan format header Excel/CSV persis sesuai dengan label di bawah ini.</p>
                                                </div>
                                                <button onClick={() => setIsUploadInfoOpen(false)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 hover:rotate-90 transition-all duration-300"><i className="bx bx-x text-2xl"></i></button>
                                            </div>
                                            <div className={`${modalBodyPaddedScrollClass} space-y-5`}>
                                                <div className="bg-amber-50 p-5 rounded-2xl border border-amber-200 w-full">
                                                    <h3 className="text-sm font-bold text-amber-800 mb-4"><i className="bx bx-info-circle mr-1"></i> Kolom Utama yang Dibutuhkan (Format Horizontal):</h3>
                                                    <div className="w-full overflow-x-auto custom-scrollbar pb-3">
                                                        <div className="flex flex-row flex-nowrap gap-3 items-center w-max">
                                                            {['NIM', 'Nama Lengkap', 'Email', 'No Telepon', 'Jenjang', 'Jurusan', 'Asal Kampus', 'Tanggal Mulai', 'Tanggal Selesai', 'Unit Tujuan', 'Mentor', 'Link Proposal', 'Link CV', 'Link Surat Pengantar', 'Link Surat Dinas', 'Link Surat Selesai', 'Link Sertifikat', 'Status'].map(col => (
                                                                <span key={col} className="shrink-0 px-4 py-2 bg-white border border-amber-200 text-amber-700 text-xs font-mono font-bold rounded-lg shadow-sm whitespace-nowrap">{col}</span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="bg-blue-50 p-5 rounded-2xl border border-blue-200">
                                                    <p className="text-sm text-blue-800 leading-relaxed font-medium">
                                                        <i className="bx bx-bulb text-xl inline-block align-middle mr-2"></i> <b>Tips Aman:</b> Untuk mencegah data <i className="font-serif">error</i>, sangat disarankan agar Anda mengeklik tombol <b>Ekspor Excel</b> terlebih dahulu, edit data dari file tersebut, lalu jadikan sebagai template untuk diunggah kembali ke sini.
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="p-5 border-t border-slate-200/50 bg-slate-50/50 flex justify-end gap-3 shrink-0">
                                                <button onClick={() => setIsUploadInfoOpen(false)} className="px-6 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">Batal</button>
                                                <button onClick={() => { setIsUploadInfoOpen(false); fileInputRef.current.click(); }} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                                                    <i className="bx bx-upload text-xl"></i> Lanjutkan Pilih File
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}

                    {/* Pop-up Modal Magang (Glassmorphism & Oval Glow) */}
                    {isModalOpen && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[200] overflow-y-auto custom-scrollbar">
                                <div className="fixed inset-0 bg-slate-900/60 transition-opacity cursor-pointer pointer-events-auto" onClick={() => setIsModalOpen(false)}></div>

                                <div className="flex min-h-full items-center justify-center p-4 sm:p-6 pointer-events-none transition-all duration-300">
                                    <div className={getModalFrameClass('wide')}>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[80%] bg-gradient-to-r from-brand-500/40 to-blue-500/40 blur-[100px] rounded-[100%] ambient-glow pointer-events-none"></div>

                                                <div><h2 className="text-lg font-bold text-navy-900">{formData.id_magang ? 'Edit Peserta Magang' : 'Tambah Peserta Baru'}</h2><p className="text-xs text-slate-500 mt-1">Isi semua detail pendaftaran magang eksternal.</p></div>

                                            <form onSubmit={handleSave} className={`${modalBodyPaddedScrollClass} space-y-4`}>

                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">NIM <span className="text-red-500">*</span></label><input type="text" required value={formData.nim} onChange={e => setFormData({ ...formData, nim: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" placeholder="Nomor Induk Mahasiswa" /></div>

                                                    <div className="col-span-2"><label className="block text-xs font-bold text-slate-700 mb-1">Asal Kampus / Sekolah <span className="text-red-500">*</span></label><input type="text" required value={formData.asal_kampus} onChange={e => setFormData({ ...formData, asal_kampus: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" placeholder="Contoh: Telkom University" /></div>

                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Tanggal Mulai <span className="text-red-500">*</span></label><input type="date" required value={formData.tanggal_mulai} onChange={e => setFormData({ ...formData, tanggal_mulai: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" /></div>
                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Tanggal Selesai <span className="text-red-500">*</span></label><input type="date" required value={formData.tanggal_selesai} onChange={e => setFormData({ ...formData, tanggal_selesai: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" /></div>

                                                    <div className="col-span-2 md:col-span-1">
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">Durasi Waktu Magang (Auto)</label>
                                                        <div className="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 flex items-center">
                                                            <span className="font-bold text-slate-700">{formData.durasi ? String(formData.durasi).replace(/[^0-9.]/g, '') + ' Bulan' : 'Pilih Tanggal'}</span>
                                                            <span className="text-[9px] text-slate-400 ml-auto italic">Otomatis dari tanggal</span>
                                                        </div>
                                                    </div>

                                                    <div className="col-span-2 md:col-span-1">
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">Status Keaktifan (Auto)</label>
                                                        <div className="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 flex items-center">
                                                            <span className={`px-2 py-1 rounded text-[10px] font-bold ${formData.status === 'Aktif' ? 'bg-brand-100 text-brand-700' : formData.status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{formData.status || 'Belum'}</span>
                                                            <span className="text-[9px] text-slate-400 ml-auto italic">Sesuai tgl pelaksanaan</span>
                                                        </div>
                                                    </div>

                                                    <div className="col-span-2 md:col-span-1">
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">Divisi Penempatan Unit</label>
                                                        <div className="flex gap-2">
                                                            <select value={formData.divisi || formData.unit_tujuan} onChange={e => setFormData({ ...formData, divisi: e.target.value, unit_tujuan: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white">
                                                                <option value="">-- Pilih Unit / Divisi --</option>
                                                                {divisiList.map((divisi, index) => (
                                                                    <option key={index} value={divisi}>{divisi}</option>
                                                                ))}
                                                                <option value="Lainnya">Lainnya (Tulis Manual)</option>
                                                            </select>
                                                            {formData.unit_tujuan === "Lainnya" && (
                                                                <input type="text" placeholder="Tulis Unit Manual..." required onChange={e => setFormData({ ...formData, unit_tujuan: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" />
                                                            )}
                                                        </div>
                                                    </div>

                                                    <div className="col-span-2 md:col-span-1">
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">Nama Mentor</label>
                                                        <input type="text" value={formData.mentor} onChange={e => setFormData({ ...formData, mentor: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" placeholder="Contoh: Budi Santoso" />
                                                    </div>

                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Link Proposal</label><input type="url" value={formData.proposal} onChange={e => setFormData({ ...formData, proposal: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white mb-2" placeholder="https://drive.google.com/..." /></div>
                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Link CV</label><input type="url" value={formData.cv} onChange={e => setFormData({ ...formData, cv: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white mb-2" placeholder="https://drive.google.com/..." /></div>
                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Link Surat Pengantar Kampus</label><input type="url" value={formData.surat_pengantar} onChange={e => setFormData({ ...formData, surat_pengantar: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white mb-2" placeholder="https://drive.google.com/..." /></div>

                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Link Surat Dinas Mentor</label><input type="url" value={formData.surat_dinas_mentor} onChange={e => setFormData({ ...formData, surat_dinas_mentor: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white mb-2" placeholder="https://drive.google.com/..." /></div>
                                                    <div className="col-span-2 md:col-span-1"><label className="block text-xs font-bold text-slate-700 mb-1">Link Surat Selesai Magang</label><input type="url" value={formData.keterangan_selesai} onChange={e => setFormData({ ...formData, keterangan_selesai: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" placeholder="https://drive.google.com/..." /></div>

                                                    <div className="col-span-2"><label className="block text-xs font-bold text-slate-700 mb-1">Link Sertifikat Magang</label><input type="url" value={formData.file_sertifikat} onChange={e => setFormData({ ...formData, file_sertifikat: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white" placeholder="https://drive.google.com/..." /></div>
                                                </div>

                                                <div className="pt-5 flex justify-end gap-3 border-t border-slate-200/50 mt-4 shrink-0">
                                                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">Batal</button>
                                                    <button type="submit" disabled={isSaving} className={`px-6 py-2.5 text-sm font-bold text-white rounded-xl transition shadow-md hover:shadow-lg ${isSaving ? 'bg-brand-400' : 'bg-brand-600 hover:bg-brand-700'}`}>
                                                        {isSaving ? <i className="bx bx-loader-alt bx-spin mr-1"></i> : null} {isSaving ? 'Menyimpan...' : 'Simpan Data'}
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </div>
            );
        };

        // --- APP ROOT ---
        const MainApp = () => {
            const [currentView, setCurrentView] = useState('dashboard');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            const [karyawanData, setKaryawanData] = useState([]);
            const [dataMagang, setDataMagang] = useState([]);
            const [dataKehadiran, setDataKehadiran] = useState([]);

            const [isLoading, setIsLoading] = useState(true);
            const [isLoadingMagang, setIsLoadingMagang] = useState(true);

            // useRef digunakan agar tidak memicu re-render (mencegah infinite loop)
            const hasFetchedRef = useRef({ karyawan: false, magang: false, kehadiran: false });

            // Satu timer terpusat — didistribusikan ke seluruh komponen via props
            const [globalNow, setGlobalNow] = useState(new Date());
            useEffect(() => {
                const t = setInterval(() => setGlobalNow(new Date()), 60000);
                return () => clearInterval(t);
            }, []);

            const parseArrayResponse = (res) => {
                try {
                    const parsed = typeof res === 'string' ? JSON.parse(res) : res;
                    return Array.isArray(parsed) ? parsed : [];
                } catch (err) {
                    console.error('Gagal parsing response array:', err);
                    return [];
                }
            };

            const fetchKaryawanData = () => {
                setIsLoading(true);
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run.withSuccessHandler((res) => {
                        let parsed = [];
                        let rawParsed = null;
                        try {
                            rawParsed = typeof res === 'string' ? JSON.parse(res) : res;
                        } catch (err) {
                            console.error("Error parsing Fetch Karyawan:", err);
                        }
                        if (rawParsed && rawParsed.error) console.error("Error Fetch Karyawan:", rawParsed.message);
                        parsed = Array.isArray(rawParsed) ? rawParsed : [];
                        setKaryawanData(parsed);
                        setIsLoading(false);
                    }).withFailureHandler((err) => {
                        console.error("Error Fetch Karyawan:", err);
                        setKaryawanData([]);
                        setIsLoading(false);
                    }).getAllDataClient();
                } else {
                    // Mock Data untuk Testing Lokal di luar Google environment
                    const mockKaryawan = [
                        { no: "1", nik: "123456", nama_karyawan: "John Doe", nomor_hp: "08123456789", jenis_kelamin: "PRIA", usia: "30", nama_posisi: "Software Engineer", band_posisi: "III", talent_cluster: "Promotable", nama_unit: "IT Dept", tgl_mulaikerja: "2020-01-15", tgl_pensiun: "2045-12-31", nilai_kinerja: "P2", nilai_kompetensi: "K3" },
                        { no: "2", nik: "123457", nama_karyawan: "Jane Smith", nomor_hp: "08198765432", jenis_kelamin: "WANITA", usia: "28", nama_posisi: "Data Analyst", band_posisi: "IV", talent_cluster: "High Potential", nama_unit: "Data Dept", tgl_mulaikerja: "2022-03-10", tgl_pensiun: "2047-12-31", nilai_kinerja: "P1", nilai_kompetensi: "K2" },
                        { no: "3", nik: "123458", nama_karyawan: "Budi Santoso", nomor_hp: "08111222333", jenis_kelamin: "PRIA", usia: "45", nama_posisi: "Manager IT", band_posisi: "II", talent_cluster: "Potential 3", nama_unit: "IT Dept", tgl_mulaikerja: "2015-05-20", tgl_pensiun: "2036-12-31", nilai_kinerja: "P3", nilai_kompetensi: "K3" },
                        { no: "4", nik: "123459", nama_karyawan: "Ani Rahmawati", nomor_hp: "08133445566", jenis_kelamin: "WANITA", usia: "35", nama_posisi: "HR Staff", band_posisi: "V", talent_cluster: "Potential 1", nama_unit: "HR Dept", tgl_mulaikerja: "2021-08-01", tgl_pensiun: "2046-12-31", nilai_kinerja: "P5", nilai_kompetensi: "K4" }
                    ];
                    setTimeout(() => {
                        setKaryawanData(mockKaryawan);
                        setIsLoading(false);
                    }, 1500);
                }
            };

            const refreshKehadiran = () => {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler(res => setDataKehadiran(parseArrayResponse(res)))
                        .withFailureHandler(err => {
                            console.error("Error Fetch Kehadiran:", err);
                            setDataKehadiran([]);
                        })
                        .getKehadiranDataClient();
                } else {
                    setDataKehadiran([]);
                }
            }
            const refreshMagang = () => {
                setIsLoadingMagang(true);
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler(res => {
                            setDataMagang(parseArrayResponse(res));
                            setIsLoadingMagang(false);
                        })
                        .withFailureHandler(err => {
                            console.error("Error Fetch Magang:", err);
                            setDataMagang([]);
                            setIsLoadingMagang(false);
                        })
                        .getMagangDataClient();
                } else {
                    setTimeout(() => {
                        setDataMagang([]);
                        setIsLoadingMagang(false);
                    }, 1000);
                }
            }

            useEffect(() => {
                const needsKaryawan = ['dashboard', 'karyawan', 'promosi', 'pensiun', 'aktivitas', 'magang'].includes(currentView);
                const needsKehadiran = ['dashboard', 'aktivitas'].includes(currentView);
                const needsMagang = ['magang'].includes(currentView);

                if (needsKaryawan && !hasFetchedRef.current.karyawan) {
                    hasFetchedRef.current.karyawan = true;
                    fetchKaryawanData();
                }
                if (needsKehadiran && !hasFetchedRef.current.kehadiran) {
                    hasFetchedRef.current.kehadiran = true;
                    refreshKehadiran();
                }
                if (needsMagang && !hasFetchedRef.current.magang) {
                    hasFetchedRef.current.magang = true;
                    refreshMagang();
                }
            }, [currentView]); // hanya currentView — hasFetchedRef tidak perlu di dependency

            const renderContent = () => {
                switch (currentView) {
                    case 'dashboard': return <DashboardView data={karyawanData} dataKehadiran={dataKehadiran} isLoading={isLoading} />;
                    case 'karyawan': return <KaryawanView data={karyawanData} isLoading={isLoading} onRefreshData={fetchKaryawanData} />;
                    case 'promosi': return <PromosiView data={karyawanData} isLoading={isLoading} onRefreshData={fetchKaryawanData} now={globalNow} />;
                    case 'aktivitas': return <AktivitasView data={karyawanData} dataKehadiran={dataKehadiran} isLoading={isLoading} onRefreshKehadiran={refreshKehadiran} />;
                    case 'pensiun': return <PensiunView dataPegawai={karyawanData} isLoadingPegawai={isLoading} onRefreshData={fetchKaryawanData} now={globalNow} />;
                    case 'magang': return <MagangView dataMagang={dataMagang} karyawanData={karyawanData} isLoading={isLoadingMagang} onRefresh={refreshMagang} />;
                    default: return <DashboardView data={karyawanData} dataKehadiran={dataKehadiran} isLoading={isLoading} />;
                }
            };

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden">
                    <aside className={`bg-navy-900 text-slate-300 shrink-0 relative z-20 shadow-2xl border-navy-800 transition-all duration-300 ease-in-out overflow-hidden ${isSidebarOpen ? 'w-64 border-r opacity-100' : 'w-0 border-r-0 opacity-0'}`}>
                        <div className="w-64 flex flex-col h-full overflow-hidden">
                            <div className="p-6 flex flex-col items-center justify-center gap-3 border-b border-navy-800/50">
                                <div className="bg-white p-2 rounded-xl flex items-center justify-center shadow-lg shadow-black/20 w-44 h-14">
                                    <img src="https://i.ibb.co.com/27N5K98Y/Infranexia-Primary-2-1.png" alt="Area 3 TIF Employee Management" className="w-full h-full object-contain" />
                                </div>
                                <div className="text-center mt-1">
                                    <h2 className="font-extrabold text-sm tracking-widest text-white uppercase leading-tight">Area 3 TIF</h2>
                                    <h2 className="font-extrabold text-[10px] tracking-widest text-brand-400 uppercase leading-tight mt-0.5">Employee Management</h2>
                                </div>
                            </div>

                            <div className="flex-1 py-6 overflow-y-auto custom-scrollbar">
                                <div className="px-6 mb-2 text-[10px] font-bold uppercase tracking-widest text-navy-400">Main Navigation</div>
                                <SidebarItem icon="bx bxs-dashboard" label="Analytics Dashboard" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                                <SidebarItem icon="bx bx-group" label="Employee Master" active={currentView === 'karyawan'} onClick={() => setCurrentView('karyawan')} />
                                <SidebarItem icon="bx bx-trending-up" label="Promotion & Transfer" active={currentView === 'promosi'} onClick={() => setCurrentView('promosi')} />

                                <div className="px-6 mt-8 mb-2 text-[10px] font-bold uppercase tracking-widest text-navy-400">Daily Management</div>
                                <SidebarItem icon="bx bx-pulse" label="Daily Activity" active={currentView === 'aktivitas'} onClick={() => setCurrentView('aktivitas')} />
                                <SidebarItem icon="bx bx-time-five" label="Retirement" active={currentView === 'pensiun'} onClick={() => setCurrentView('pensiun')} />
                                <SidebarItem icon="bx bxs-graduation" label="Internship" active={currentView === 'magang'} onClick={() => setCurrentView('magang')} />
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 relative">
                        <header className="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0 z-10 shadow-sm">
                            <div className="flex-1 font-extrabold text-navy-900 text-lg flex items-center gap-3">
                                <i className="bx bx-menu text-2xl text-slate-400 cursor-pointer hover:text-brand-600 transition" onClick={() => setIsSidebarOpen(!isSidebarOpen)}></i> Area 3 TIF Employee Management
                            </div>
                            <div className="flex items-center gap-6">
                                <LiveClock now={globalNow} />
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 sm:p-8 custom-scrollbar relative">
                            {renderContent()}
                        </div>
                    </main>
                </div>
            );
        };

        window.onload = () => {
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                try {
                    preloader.style.opacity = '0';
                    setTimeout(() => {
                        preloader.style.display = 'none';
                        const root = window.ReactDOM.createRoot(document.getElementById('root'));
                        root.render(<MainApp />);
                    }, 500);
                } catch (err) {
                    console.error('Gagal render aplikasi:', err);
                    preloader.innerHTML = '<div style="text-align:center;padding:2rem;">' +
                        '<p style="font-size:1.2rem;font-weight:bold;color:#dc2626;margin-bottom:1rem;">⚠️ Gagal Memuat Aplikasi</p>' +
                        '<p style="color:#64748b;margin-bottom:1rem;">' + err.message + '</p>' +
                        '<button onclick="location.reload()" style="padding:0.5rem 1.5rem;background:#2563eb;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.9rem;">🔄 Muat Ulang</button>' +
                        '</div>';
                }
            }, 1000);

            // Fallback: jika setelah 15 detik preloader masih terlihat, tampilkan pesan error
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                if (preloader && preloader.style.display !== 'none') {
                    preloader.innerHTML = '<div style="text-align:center;padding:2rem;">' +
                        '<p style="font-size:1.2rem;font-weight:bold;color:#dc2626;margin-bottom:1rem;">⚠️ Aplikasi Tidak Merespons</p>' +
                        '<p style="color:#64748b;margin-bottom:0.5rem;">Kemungkinan penyebab:</p>' +
                        '<ul style="color:#64748b;text-align:left;display:inline-block;margin-bottom:1rem;font-size:0.85rem;">' +
                        '<li>Koneksi internet lambat/terputus</li>' +
                        '<li>Library CDN gagal dimuat</li>' +
                        '<li>Browser extension mengganggu</li>' +
                        '</ul><br>' +
                        '<button onclick="location.reload()" style="padding:0.5rem 1.5rem;background:#2563eb;color:white;border:none;border-radius:0.5rem;cursor:pointer;font-size:0.9rem;">🔄 Muat Ulang</button>' +
                        '</div>';
                }
            }, 15000);
        };
</script>
