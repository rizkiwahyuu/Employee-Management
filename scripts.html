                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Nilai Kinerja Usulan</label>
                                                    <input
                                                        type="text"
                                                        value={usulKinerja}
                                                        onChange={(e) => setUsulKinerja(e.target.value)}
                                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white"
                                                        placeholder="Contoh: P2"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Nilai Kompetensi Usulan</label>
                                                    <input
                                                        type="text"
                                                        value={usulKompetensi}
                                                        onChange={(e) => setUsulKompetensi(e.target.value)}
                                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white"
                                                        placeholder="Contoh: K3"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Nilai Behavior Usulan</label>
                                                    <input
                                                        type="text"
                                                        value={usulBehavior}
                                                        onChange={(e) => setUsulBehavior(e.target.value)}
                                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white"
                                                        placeholder="Contoh: B3"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Tanggal Efektif Usulan</label>
                                                    <input
                                                        type="date"
                                                        value={usulTglEfektif}
                                                        onChange={(e) => setUsulTglEfektif(e.target.value)}
                                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white"
                                                    />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Catatan</label>
                                                <textarea
                                                    value={usulCatatan}
                                                    onChange={(e) => setUsulCatatan(e.target.value)}
                                                    rows={3}
                                                    className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-brand-500 focus:outline-none bg-white resize-none"
                                                    placeholder="Tambahkan catatan usulan (opsional)"
                                                />
                                            </div>
                                            <div className="pt-5 flex justify-end gap-3 border-t border-slate-200/50 mt-2">
                                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">Batal</button>
                                                <button type="submit" disabled={isSaving} className={`px-6 py-2.5 text-sm font-bold text-white rounded-xl transition shadow-md hover:shadow-lg ${isSaving ? 'bg-brand-400' : 'bg-brand-600 hover:bg-brand-700'}`}>
                                                    {isSaving ? <i className="bx bx-loader-alt bx-spin mr-1"></i> : null} {isSaving ? 'Menyimpan...' : 'Ajukan Usulan'}
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </div>
            );
        };

        // 4. AKTIVITAS HARIAN
        const AktivitasView = ({ data, dataKehadiran, isLoading, onRefreshKehadiran }) => {
            const [startDate, setStartDate] = useState(() => getTodayWIB());
            const [searchTerm, setSearchTerm] = useState('');

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isUploadInfoOpen, setIsUploadInfoOpen] = useState(false);
            const [isAddMode, setIsAddMode] = useState(false);
            const [editLog, setEditLog] = useState({ row_index: -1, tanggal: '', nik: '', nama: '', status: 'Telah Mengajukan Activity', unit_kerja: '' });
            const [isSaving, setIsSaving] = useState(false);
            const [showRekapView, setShowRekapView] = useState(false);
            const [isCapturing, setIsCapturing] = useState(false);
            const [clickPos, setClickPos] = useState({ x: null, y: null });

            // State untuk modal pop-up detail klik card statistik
            const [detailModal, setDetailModal] = useState(null);

            const fileUploadRef = useRef(null);
            const rekapCaptureRef = useRef(null);
            const rekapTableScrollRef = useRef(null);
            const topScrollRef = useRef(null);
            const bottomScrollRef = useRef(null);
            const [tableScrollWidth, setTableScrollWidth] = useState('100%');
            const [isUploading, setIsUploading] = useState(false);

            const attendanceLogs = useMemo(() => {
                const masterEmployees = Array.isArray(data)
                    ? data.filter(emp => normalizeNikKey(emp.nik))
                    : [];
                if (masterEmployees.length === 0) return [];

                // Filter hanya untuk SATU TANGGAL
                const dateKeys = buildDateRangeKeys(startDate, startDate);
                if (dateKeys.length === 0) return [];
                const allowedDates = new Set(dateKeys);

                const rawLogs = Array.isArray(dataKehadiran) ? dataKehadiran : [];
                // Map NIK -> log terbaru. Kunci menggunakan normalizeNikKey (tanpa leading zeros)
                const latestLogByNik = new Map();

                rawLogs.forEach(record => {
                    const nik = normalizeNikKey(record.nik || record.n_nik || record.nomor_induk || '');
                    if (!nik) return;

                    const recordDateRaw = parseDateStringSafe(record.tanggal || record.waktu || record.date || record.last_update);
                    if (!recordDateRaw || isNaN(recordDateRaw.getTime())) return;

                    // Data dari server sudah YYYY-MM-DD dalam timezone WIB — gunakan langsung
                    const dateKey = `${recordDateRaw.getFullYear()}-${String(recordDateRaw.getMonth() + 1).padStart(2, '0')}-${String(recordDateRaw.getDate()).padStart(2, '0')}`;

                    if (!allowedDates.has(dateKey)) return;

                    let rawStatus = String(record.status || record.status_pengajuan || '').toLowerCase();
                    let rawCuti = String(record.status_cuti || record.cuti || '').toLowerCase();
                    let finalStatus = 'Belum Mengajukan';

                    if (rawCuti && rawCuti !== '-' && rawCuti !== '' && rawCuti !== 'undefined') {
                        finalStatus = 'Cuti';
                    } else if (rawStatus.includes('cuti') || rawStatus.includes('sakit') || rawStatus.includes('izin') || rawStatus.includes('leave')) {
                        finalStatus = 'Cuti';
                    } else if (rawStatus.includes('telah') || rawStatus.includes('hadir') || rawStatus === 'v' || rawStatus.includes('wfo') || rawStatus.includes('wfh')) {
                        finalStatus = 'Telah Mengajukan Activity';
                    } else if (rawStatus && !rawStatus.includes('belum') && rawStatus !== '-') {
                        finalStatus = 'Telah Mengajukan Activity';
                    }

                    const normalizedLog = {
                        row_index: record.row_index,
                        nik,
                        nama_karyawan: record.nama_karyawan || record.v_nama_karyawan || record.nama || '-',
                        targetDate: dateKey,
                        status: finalStatus,
                        unit_kerja: record.nama_unit || record.unit_kerja || '-',
                        nama_unit: record.nama_unit || record.unit_kerja || '-',
                        nama_posisi: record.nama_posisi || '-',
                        jenis_kelamin: record.jenis_kelamin || '-',
                        sortDate: recordDateRaw
                    };

                    const existing = latestLogByNik.get(nik);
                    if (!existing || existing.sortDate < recordDateRaw) {
                        latestLogByNik.set(nik, normalizedLog);
                    }
                });

                const fallbackDate = dateKeys[dateKeys.length - 1] || startDate;
                const area3List = [
                    "SERVICE OPERATION", "ASSET INVENTORY & DATA GOVERNANCE", "PERFORMANCE & SHARED SERVICE",
                    "ENGINEERING &DEPLOYMENT JATIM&BALI NUSRA", "NETWORK OPERATION JATIM & BALI NUSRA",
                    "SALES SUPPORT JATIM & BALI NUSRA", "ENGINEERING & DEPLOYMENT JATENG & DIY",
                    "NETWORK OPERATION JATENG & DIY", "SALES SUPPORT JATENG & DIY", "EVP AREA 3"
                ].map(s => s.replace(/\s+/g, '').toUpperCase());

                // Cek jika memang tidak ada satupun log kehadiran (berarti sheet kosong / file belum diupload), 
                // kembalikan array kosong agar tidak memunculkan "template" Belum Mengajukan yang mengganggu
                if (latestLogByNik.size === 0) return [];

                // masterEmployees SUDAH dalam urutan DB_KARYAWAN (atas ke bawah)
                // Map setiap baris master ke status kehadiran
                const verifiedLogs = masterEmployees.map(emp => {
                    const nik = normalizeNikKey(emp.nik);
                    const existingLog = latestLogByNik.get(nik);

                    let u2 = String(emp.unit_2 || '').trim();
                    let u3 = String(emp.unit_3 || '').trim();
                    let pos = String(emp.nama_posisi || emp.jabatan || emp.posisi || '').trim();
                    let finalUnit = u2 || u3 || pos || String(emp.nama_unit || '').trim() || '-';

                    let normalizedUnit = finalUnit.replace(/\s+/g, '').toUpperCase();
                    if (area3List.includes(normalizedUnit)) {
                        finalUnit = "AREA 3";
                    }

                    return {
                        row_index: existingLog ? existingLog.row_index : -1,
                        nik,
                        nama_karyawan: emp.nama_karyawan || (existingLog ? existingLog.nama_karyawan : '') || '-',
                        targetDate: existingLog ? existingLog.targetDate : fallbackDate,
                        status: existingLog ? existingLog.status : 'Belum Mengajukan',
                        unit_kerja: finalUnit,
                        nama_unit: finalUnit,
                        nama_posisi: emp.nama_posisi || (existingLog ? existingLog.nama_posisi : '') || '-',
                        jenis_kelamin: emp.jenis_kelamin || (existingLog ? existingLog.jenis_kelamin : '') || '-'
                    };
                });

                // Urutan sudah sesuai DB_KARYAWAN karena mengikuti masterEmployees
                return verifiedLogs;
            }, [dataKehadiran, startDate, data]);

            const filteredLogs = attendanceLogs.filter(log => {
                const s = String(searchTerm).toLowerCase();
                return !searchTerm ||
                    (log.nama_karyawan && String(log.nama_karyawan).toLowerCase().includes(s)) ||
                    (log.nik && String(log.nik).toLowerCase().includes(s)) ||
                    (log.nama_unit && String(log.nama_unit).toLowerCase().includes(s)) ||
                    (log.unit_kerja && String(log.unit_kerja).toLowerCase().includes(s)) ||
                    (log.nama_posisi && String(log.nama_posisi).toLowerCase().includes(s)) ||
                    (log.jenis_kelamin && String(log.jenis_kelamin).toLowerCase().includes(s));
            });

            const startDateLabel = formatDateLongID(startDate);

            // Calculate Summary Data for the new Sub-Page
            const summaryData = useMemo(() => {
                const summary = {};
                let orderIndex = 0;
                filteredLogs.forEach(log => {
                    const unit = log.nama_unit || log.unit_kerja || 'Unknown';
                    if (!summary[unit]) {
                        summary[unit] = { unit, telah: 0, belum: 0, cuti: 0, total: 0, order: orderIndex++ };
                    }
                    summary[unit].total++;
                    if (log.status === 'Telah Mengajukan Activity') {
                        summary[unit].telah++;
                    } else if (log.status === 'Cuti') {
                        summary[unit].cuti++;
                    } else {
                        summary[unit].belum++;
                    }
                });

                return Object.values(summary).map(item => ({
                    ...item,
                    percentage: item.total > 0 ? (((item.telah + item.cuti) / item.total) * 100).toFixed(1) : 0
                })).sort((a, b) => a.order - b.order);
            }, [filteredLogs]);

            const handleEditClick = (log, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setIsAddMode(false);
                setEditLog({
                    row_index: log.row_index, tanggal: log.targetDate, nik: log.nik, nama: log.nama_karyawan, status: log.status, unit_kerja: log.unit_kerja
                });
                setIsModalOpen(true);
            };

            const handleAddClick = (e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setIsAddMode(true);
                setEditLog({ row_index: -1, tanggal: startDate, nik: '', nama: '', status: 'Telah Mengajukan Activity', unit_kerja: '' });
                setIsModalOpen(true);
            };

            const handleSaveForm = (e) => {
                e.preventDefault(); setIsSaving(true);
                const newData = {
                    row_index: editLog.row_index, tanggal: editLog.tanggal, nik: editLog.nik, nama_karyawan: editLog.nama, unit_kerja: editLog.unit_kerja, status: editLog.status
                };
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler(res => {
                            setIsSaving(false);
                            let parsed = {};
                            try { parsed = JSON.parse(res); } catch (_) { parsed = {}; }
                            if (parsed.error) return alert("Gagal update: " + parsed.message);
                            setIsModalOpen(false);
                            onRefreshKehadiran();
                        })
                        .withFailureHandler(err => { setIsSaving(false); alert("Error: " + err); })
                        .saveKehadiranClient(newData);
                } else {
                    setIsSaving(false);
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const openDetail = (type, e = null) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                let filtered = [];
                let modalTitle = "";
                let modalIcon = "";

                if (type === 'Total') {
                    filtered = filteredLogs;
                    modalTitle = "Total Data Pegawai";
                    modalIcon = "bx-group";
                } else if (type === 'Sudah') {
                    filtered = filteredLogs.filter(l => l.status === 'Telah Mengajukan Activity');
                    modalTitle = "Telah Mengajukan Activity";
                    modalIcon = "bx-check-circle";
                } else if (type === 'Cuti') {
                    filtered = filteredLogs.filter(l => l.status === 'Cuti');
                    modalTitle = "Cuti / Sakit / Izin";
                    modalIcon = "bx-error-circle";
                } else if (type === 'Belum') {
                    filtered = filteredLogs.filter(l => l.status === 'Belum Mengajukan');
                    modalTitle = "Belum Mengajukan Activity";
                    modalIcon = "bx-x-circle";
                }

                setDetailModal({ title: modalTitle, icon: modalIcon, list: filtered });
            };

            const handleExportExcelDetail = () => {
                if (filteredLogs.length === 0) return alert("Tidak ada data untuk diekspor!");
                const exportData = filteredLogs.map((log, index) => ({
                    'No': index + 1,
                    'Tanggal': formatDateLongID(log.targetDate),
                    'NIK': log.nik,
                    'PEGAWAI': log.nama_karyawan,
                    'UNIT': log.nama_unit || log.unit_kerja || '-',
                    'POSISI': log.nama_posisi || '-',
                    'JENIS KELAMIN': log.jenis_kelamin || '-',
                    'Daily Activity': log.status
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Detail_Aktivitas");
                XLSX.writeFile(wb, `Laporan_Aktivitas_${startDate}.xlsx`, { bookType: "xlsx" });
            };

            const handleExportSummary = () => {
                if (summaryData.length === 0) return alert("Tidak ada data summary untuk diekspor!");
                let totalBelum = 0, totalTelah = 0, totalCuti = 0, totalAll = 0;

                const exportData = summaryData.map((item, index) => {
                    totalBelum += item.belum;
                    totalTelah += item.telah;
                    totalCuti += item.cuti;
                    totalAll += item.total;
                    return {
                        'No': index + 1,
                        'DIVISI': item.unit,
                        'BELUM MENGAJUKAN': item.belum,
                        'TELAH MENGAJUKAN': item.telah,
                        'CUTI': item.cuti,
                        'TOTAL': item.total,
                        '%': `${item.percentage}%`
                    };
                });

                exportData.push({
                    'No': '',
                    'DIVISI': 'GRAND TOTAL',
                    'BELUM MENGAJUKAN': totalBelum,
                    'TELAH MENGAJUKAN': totalTelah,
                    'CUTI': totalCuti,
                    'TOTAL': totalAll,
                    '%': totalAll > 0 ? `${(((totalTelah + totalCuti) / totalAll) * 100).toFixed(1)}%` : '0%'
                });

                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Summary_Activity");
                XLSX.writeFile(wb, `Summary_Aktivitas_${startDate}.xlsx`, { bookType: "xlsx" });
            };

            const handleCaptureRekap = async () => {
                let previousInlineStyle = null;
                let previousCaptureStyle = null;
                setIsCapturing(true);
                try {
                    if (!rekapCaptureRef.current || !window.html2canvas) {
                        alert("Fitur capture belum siap di browser ini.");
                        return;
                    }
                    if (rekapTableScrollRef.current) {
                        previousInlineStyle = {
                            maxHeight: rekapTableScrollRef.current.style.maxHeight,
                            overflow: rekapTableScrollRef.current.style.overflow,
                            overflowX: rekapTableScrollRef.current.style.overflowX,
                            overflowY: rekapTableScrollRef.current.style.overflowY
                        };
                        rekapTableScrollRef.current.style.maxHeight = 'none';
                        rekapTableScrollRef.current.style.overflow = 'visible';
                        rekapTableScrollRef.current.style.overflowX = 'visible';
                        rekapTableScrollRef.current.style.overflowY = 'visible';
                    }

                    // Paksa ukuran desktop untuk capture agar rapi berapapun ukuran window user
                    previousCaptureStyle = {
                        width: rekapCaptureRef.current.style.width,
                        maxWidth: rekapCaptureRef.current.style.maxWidth
                    };
                    rekapCaptureRef.current.style.width = '1440px';
                    rekapCaptureRef.current.style.maxWidth = '1440px';

                    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

                    const targetWidth = 1440;
                    const targetHeight = Math.max(rekapCaptureRef.current.scrollHeight, rekapCaptureRef.current.clientHeight);

                    const canvas = await window.html2canvas(rekapCaptureRef.current, {
                        scale: 2,
                        backgroundColor: '#f8fafc',
                        useCORS: true,
                        width: targetWidth,
                        height: targetHeight,
                        windowWidth: targetWidth,
                        windowHeight: targetHeight,
                        scrollX: 0,
                        scrollY: -window.scrollY
                    });
                    const link = document.createElement('a');
                    link.download = `Rekap_Divisi_${startDate}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    alert("Gagal membuat capture rekap.");
                } finally {
                    if (rekapCaptureRef.current && previousCaptureStyle) {
                        rekapCaptureRef.current.style.width = previousCaptureStyle.width;
                        rekapCaptureRef.current.style.maxWidth = previousCaptureStyle.maxWidth;
                    }
                    if (rekapTableScrollRef.current && previousInlineStyle) {
                        rekapTableScrollRef.current.style.maxHeight = previousInlineStyle.maxHeight;
                        rekapTableScrollRef.current.style.overflow = previousInlineStyle.overflow;
                        rekapTableScrollRef.current.style.overflowX = previousInlineStyle.overflowX;
                        rekapTableScrollRef.current.style.overflowY = previousInlineStyle.overflowY;
                    }
                    setIsCapturing(false);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return; setIsUploading(true); const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result; const wb = XLSX.read(bstr, { type: 'binary' }); const wsname = wb.SheetNames[0]; const ws = wb.Sheets[wsname];
                        const rawData = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false, dateNF: 'yyyy-mm-dd' });

                        if (rawData.length === 0) { alert("File kosong/format salah."); setIsUploading(false); return; }

                        if (typeof google !== 'undefined' && google.script) {
                            google.script.run
                                .withSuccessHandler((res) => {
                                    setIsUploading(false); const parsed = JSON.parse(res);
                                    if (parsed.error) alert("Gagal impor: " + parsed.message);
                                    else { alert("SUKSES: Data Activity berhasil diimpor ke DB_DAILY ACTIVITY RAW."); onRefreshKehadiran(); }
                                })
                                .withFailureHandler((err) => { setIsUploading(false); alert("Error Server: " + err); })
                                .bulkImportKehadiranClient(rawData);
                        } else {
                            setIsUploading(false); alert("Mode lokal: Simulasi upload berhasil.");
                        }
                    } catch (error) { setIsUploading(false); alert("Gagal membaca file CSV/Excel."); }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            useEffect(() => {
                if (bottomScrollRef.current) {
                    setTableScrollWidth(`${bottomScrollRef.current.scrollWidth}px`);
                }
            }, [filteredLogs]);

            const handleTopScroll = (e) => {
                if (bottomScrollRef.current && bottomScrollRef.current.scrollLeft !== e.target.scrollLeft) {
                    bottomScrollRef.current.scrollLeft = e.target.scrollLeft;
                }
            };

            const handleBottomScroll = (e) => {
                if (topScrollRef.current && topScrollRef.current.scrollLeft !== e.target.scrollLeft) {
                    topScrollRef.current.scrollLeft = e.target.scrollLeft;
                }
            };

            if (isLoading) return <div className="p-8 text-slate-500"><i className="bx bx-loader-alt bx-spin mr-2"></i>Memuat Aktivitas...</div>;

            // ==========================================
            // HALAMAN SUB-MENU REKAPITULASI
            // ==========================================
            if (showRekapView) {
                // Kalkulasi total yang lebih aman dan dieksekusi di luar JSX
                const totalBelum = summaryData ? summaryData.reduce((acc, curr) => acc + (curr.belum || 0), 0) : 0;
                const totalTelah = summaryData ? summaryData.reduce((acc, curr) => acc + (curr.telah || 0), 0) : 0;
                const totalCuti = summaryData ? summaryData.reduce((acc, curr) => acc + (curr.cuti || 0), 0) : 0;
                const totalAll = summaryData ? summaryData.reduce((acc, curr) => acc + (curr.total || 0), 0) : 0;
                const grandPercentage = totalAll > 0 ? (((totalTelah + totalCuti) / totalAll) * 100).toFixed(1) : "0.0";

                return (
                    <div className="fade-in space-y-4 pb-10 w-full min-w-0">
                        <div className="flex justify-between items-center gap-4 toolbar-scroll custom-scrollbar pb-2" data-html2canvas-ignore="true">
                            <button onClick={() => setShowRekapView(false)} className="w-10 h-10 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-full transition shadow-sm flex items-center justify-center shrink-0">
                                <i className="bx bx-arrow-back text-2xl"></i>
                            </button>
                            <div className="flex items-center gap-2 shrink-0">
                                <button onClick={handleCaptureRekap} disabled={isCapturing} className="bg-white hover:bg-slate-50 text-navy-900 border border-slate-300 px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex items-center gap-2 disabled:opacity-50">
                                    {isCapturing ? <i className="bx bx-loader-alt bx-spin text-lg"></i> : <i className="bx bx-camera text-lg"></i>} Capture Rekap
                                </button>
                                <button onClick={handleExportSummary} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2">
                                    <i className="bx bx-download text-lg"></i> Ekspor Rekap Excel
                                </button>
                            </div>
                        </div>

                        <div ref={rekapCaptureRef} className="w-full max-w-[1360px] min-w-0 px-2 sm:px-4 pb-6 bg-white p-2 sm:p-5 rounded-lg">
                            <div className="mb-5">
                                <div className="inline-flex items-center rounded-full bg-brand-50 px-6 py-2 text-[12px] font-extrabold tracking-[0.35em] text-brand-700 shadow-sm">
                                    LAPORAN REKAP AKTIVITAS
                                </div>
                                <h1 className="mt-5 text-3xl sm:text-4xl font-extrabold tracking-tight text-navy-900">Rekapitulasi per Divisi</h1>
                                <p className="mt-2 text-lg font-semibold text-slate-500">Tanggal: {startDateLabel || ''}</p>
                                <div className="mt-5 h-px w-full bg-slate-200"></div>
                            </div>

                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden w-full">
                                <div ref={rekapTableScrollRef} className="overflow-x-auto custom-scrollbar w-full">
                                    <table className="w-full text-left text-[11px] whitespace-nowrap min-w-[900px]">
                                        <thead className="bg-slate-50 text-slate-500 text-[9px] uppercase tracking-[0.1em] font-extrabold sticky top-0 z-10 shadow-sm border-b border-slate-200">
                                            <tr>

                                            <div><h2 className="text-lg font-bold text-navy-900">{isAddMode ? 'Tambah Kehadiran Manual' : 'Edit Daily Activity'}</h2></div>
                                            <button onClick={() => setIsModalOpen(false)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 hover:rotate-90 transition-all duration-300"><i className="bx bx-x text-2xl"></i></button>
                                        </div>
                                        <form onSubmit={handleSaveForm} className={`${modalBodyPaddedScrollClass} space-y-4`}>
                                            {isAddMode ? (
                                                <>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">Tanggal <span className="text-red-500">*</span></label>
                                                        <input type="date" required value={editLog.tanggal} onChange={e => setEditLog({ ...editLog, tanggal: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-brand-500 bg-white" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-700 mb-1">NIK Pegawai <span className="text-red-500">*</span></label>
                                                        <input type="text" required value={editLog.nik} onChange={e => setEditLog({ ...editLog, nik: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-brand-500 bg-white" placeholder="Masukkan NIK" />
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="text-center mb-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                                    <div className="font-bold text-navy-900 text-base">{editLog.nama}</div>
                                                    <div className="text-xs text-brand-600 font-bold mt-1">{editLog.nik} &bull; {formatDateDMY(editLog.tanggal)}</div>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-4 mt-2">
                                                <div><label className="block text-xs font-bold text-slate-700 mb-1">UNIT</label><input type="text" disabled value={editLog.unit_kerja} className="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 cursor-not-allowed" /></div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Daily Activity</label>
                                                    <select value={editLog.status} onChange={e => setEditLog({ ...editLog, status: e.target.value })} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:border-brand-500 focus:outline-none">
                                                        <option value="Telah Mengajukan Activity">Telah Mengajukan</option>
                                                        <option value="Belum Mengajukan">Belum Mengajukan</option>
                                                        <option value="Cuti">Cuti</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="pt-5 flex justify-end gap-3 border-t border-slate-200/50 mt-2">
                                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 rounded-xl transition">Batal</button>
                                                <button type="submit" disabled={isSaving} className={`px-6 py-2.5 text-sm font-bold text-white rounded-xl transition shadow-md hover:shadow-lg ${isSaving ? 'bg-brand-400' : 'bg-brand-600 hover:bg-brand-700'}`}>{isSaving ? 'Menyimpan...' : 'Simpan DB'}</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </div>
            );
        };

        // 5. MANAJEMEN PENSIUN
        const PensiunView = ({ dataPegawai, isLoadingPegawai, onRefreshData, now = new Date() }) => {
            const [activeTab, setActiveTab] = useState('daftar'); // 'daftar' | 'riwayat'
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('Semua');
            // 'now' diterima sebagai prop dari MainApp — tidak perlu state atau timer lokal
            // Modal Detail State
            const [detailModal, setDetailModal] = useState(null);

            // Modal Edit State
            const [isEditOpen, setIsEditOpen] = useState(false);
            const [isUploadInfoOpen, setIsUploadInfoOpen] = useState(false);
            const [editData, setEditData] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [clickPos, setClickPos] = useState({ x: null, y: null });

            // State Upload File CSV
            const fileUploadRef = useRef(null);
            const [isUploading, setIsUploading] = useState(false);

            // === STATE: USULAN PENSIUN ===
            const [usulanData, setUsulanData] = useState([]);
            const [isLoadingUsulan, setIsLoadingUsulan] = useState(false);
            const [isUsulModalOpen, setIsUsulModalOpen] = useState(false);
            const [usulTarget, setUsulTarget] = useState(null);
            const [usulCatatan, setUsulCatatan] = useState('');
            const [isSubmittingUsul, setIsSubmittingUsul] = useState(false);
            const [searchUsulan, setSearchUsulan] = useState('');

            // 'now' diperbarui oleh satu timer terpusat di MainApp — tidak perlu timer lokal di sini

            // Fetch usulan saat tab riwayat dibuka
            useEffect(() => {
                if (activeTab === 'riwayat') fetchUsulan();
            }, [activeTab]);

            const fetchUsulan = () => {
                setIsLoadingUsulan(true);
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsLoadingUsulan(false);
                            try { const parsed = JSON.parse(res); setUsulanData(Array.isArray(parsed) ? parsed : []); } catch { setUsulanData([]); }
                        })
                        .withFailureHandler(() => { setIsLoadingUsulan(false); })
                        .getUsulanPensiunClient();
                } else {
                    setIsLoadingUsulan(false);
                    setUsulanData([
                        { nik: 'DEMO001', nama_karyawan: 'Demo Pegawai', usia: '55', nama_posisi: 'Manager', nama_unit: 'IT Dept', nama_employee_group: 'Dalam Proses Pensiun', tgl_mulaikerja: '2000-01-01', tgl_pensiun: '2025-12-31', status_usulan: 'Menunggu ACC', tgl_diusulkan: '21 Mei 2025', catatan: '-' }
                    ]);
                }
            };

            // Helper: hitung selisih dua tanggal dalam Y, M, D
            const calcYMD = (startDate, endDate) => {
                let y = endDate.getFullYear() - startDate.getFullYear();
                let m = endDate.getMonth() - startDate.getMonth();
                let d = endDate.getDate() - startDate.getDate();
                if (d < 0) { m--; const prevMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 0); d += prevMonth.getDate(); }
                if (m < 0) { y--; m += 12; }
                return { y, m, d };
            };

            const processedData = useMemo(() => {
                if (!dataPegawai || dataPegawai.length === 0) return [];
                const todayWIBStr = getTodayWIB();
                const nowWIBMidnight = new Date(todayWIBStr + 'T00:00:00');
                const nowWIB = new Date(now.getTime ? now : Date.now());

                return dataPegawai.map(emp => {
                    const start = parseDateStringSafe(emp.tgl_mulaikerja);
                    const end = parseDateStringSafe(emp.tgl_pensiun);
                    let masaKerja = "-", durasi = "-", countdown = "-", sisaHari = 999999;
                    let statusLabel = "Tgl Belum Diset", badgeType = "neutral";

                    if (start && end) {
                        if (nowWIBMidnight >= start) {
                            const mk = calcYMD(start, nowWIBMidnight);
                            const parts = [];
                            if (mk.y > 0) parts.push(`${mk.y} Thn`);
                            if (mk.m > 0) parts.push(`${mk.m} Bln`);
                            if (mk.d > 0 || parts.length === 0) parts.push(`${mk.d} Hr`);
                            masaKerja = parts.join(' ');
                        } else { masaKerja = "Belum Mulai"; }

                        if (end >= start) {
                            const dur = calcYMD(start, end);
                            const dp = [];
                            if (dur.y > 0) dp.push(`${dur.y} Thn`);
                            if (dur.m > 0) dp.push(`${dur.m} Bln`);
                            if (dp.length === 0) dp.push(`${dur.d} Hr`);
                            durasi = dp.join(' ');
                        }

                        const diffPensiun = end.getTime() - nowWIB.getTime();
                        sisaHari = Math.ceil(diffPensiun / (1000 * 60 * 60 * 24));

                        if (diffPensiun <= 0) {
                            statusLabel = "Purna Tugas"; badgeType = "danger"; countdown = "Sudah Pensiun";
                        } else {
                            const cdYMD = calcYMD(nowWIBMidnight, end);
                            const cdParts = [];
                            if (cdYMD.y > 0) cdParts.push(`${cdYMD.y} Thn`);
                            if (cdYMD.m > 0) cdParts.push(`${cdYMD.m} Bln`);
                            if (cdYMD.d > 0 || cdParts.length === 0) cdParts.push(`${cdYMD.d} Hari`);
                            countdown = cdParts.join(' ');
                            if (sisaHari <= 365) { statusLabel = "MPP (< 1 Tahun)"; badgeType = "warning"; }
                            else if (sisaHari <= 1095) { statusLabel = "1 - 3 Tahun"; badgeType = "brand"; }
                            else { statusLabel = "Aktif (> 3 Tahun)"; badgeType = "success"; }
                        }
                    } else if (start && !end) {
                        if (nowWIBMidnight >= start) {
                            const mk = calcYMD(start, nowWIBMidnight);
                            const parts = [];
                            if (mk.y > 0) parts.push(`${mk.y} Thn`);
                            if (mk.m > 0) parts.push(`${mk.m} Bln`);
                            if (mk.d > 0 || parts.length === 0) parts.push(`${mk.d} Hr`);
                            masaKerja = parts.join(' ');
                        }
                        countdown = "Tgl Pensiun Belum Diset"; statusLabel = "Tgl Belum Diset"; badgeType = "neutral";
                    }
                    return { ...emp, masaKerja, durasi, countdown, sisaHari, statusLabel, badgeType };
                });
            }, [dataPegawai, now]);

            const statMPP = processedData.filter(e => e.statusLabel === 'MPP (< 1 Tahun)').length;
            const stat1_3 = processedData.filter(e => e.statusLabel === '1 - 3 Tahun').length;
            const statPurna = processedData.filter(e => e.statusLabel === 'Purna Tugas').length;

            const filteredData = useMemo(() => {
                return processedData.filter(emp => {
                    const matchSearch = !searchTerm || (emp.nama_karyawan || '').toLowerCase().includes(searchTerm.toLowerCase()) || (emp.nik || '').includes(searchTerm);
                    const matchFilter = filterStatus === 'Semua' || emp.statusLabel === filterStatus;
                    return matchSearch && matchFilter;
                });
            }, [processedData, searchTerm, filterStatus]);

            const filteredUsulan = useMemo(() => {
                if (!searchUsulan) return usulanData;
                return usulanData.filter(u => (u.nama_karyawan || '').toLowerCase().includes(searchUsulan.toLowerCase()) || (u.nik || '').includes(searchUsulan));
            }, [usulanData, searchUsulan]);

            const openDetail = (type, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                let filtered = processedData, modalTitle = "Semua Pegawai", modalIcon = "bx-group";
                if (type === 'MPP') { filtered = processedData.filter(e => e.statusLabel === 'MPP (< 1 Tahun)'); modalTitle = "MPP (< 1 Tahun)"; modalIcon = "bx-timer"; }
                else if (type === '1_3') { filtered = processedData.filter(e => e.statusLabel === '1 - 3 Tahun'); modalTitle = "Pensiun 1-3 Tahun"; modalIcon = "bx-calendar-event"; }
                else if (type === 'Purna') { filtered = processedData.filter(e => e.statusLabel === 'Purna Tugas'); modalTitle = "Purna Tugas"; modalIcon = "bx-check-shield"; }
                setDetailModal({ title: modalTitle, icon: modalIcon, list: filtered });
            };

            const openEditModal = (emp, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setEditData({ ...emp, tgl_mulaikerja: normalizeDateForInput(emp.tgl_mulaikerja), tgl_pensiun: normalizeDateForInput(emp.tgl_pensiun), nama_employee_group: emp.nama_employee_group || 'Aktif' });
                setIsEditOpen(true);
            };

            const handleAutoSetPensiun = () => {
                if (!editData.usia || isNaN(editData.usia)) return alert("Tolong isi umur/usia karyawan terlebih dahulu!");
                const umurInt = parseInt(editData.usia);
                const currentYearWIB = parseInt(getTodayWIB().split('-')[0]);
                const thnPensiun = currentYearWIB + (55 - umurInt);
                setEditData({ ...editData, tgl_pensiun: `${thnPensiun}-12-31` });
            };

            const saveEdit = (e) => {
                e.preventDefault(); setIsSaving(true);
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run.withSuccessHandler((res) => {
                        setIsSaving(false); const parsed = JSON.parse(res);
                        if (parsed.error) alert("Gagal update: " + parsed.message);
                        else { setIsEditOpen(false); onRefreshData(); }
                    }).withFailureHandler((err) => { setIsSaving(false); alert("Error: " + err); }).updateDataClient(editData);
                } else {
                    setIsSaving(false);
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleDelete = (nik) => {
                if (!confirm("PERINGATAN: Apakah Anda yakin ingin menghapus data pegawai ini secara permanen dari Database Master?")) return;
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run.withSuccessHandler((res) => {
                        const parsed = JSON.parse(res);
                        if (parsed.error) alert("Gagal menghapus: " + parsed.message);
                        else { alert("Data berhasil dihapus dari Master Pegawai!"); onRefreshData(); }
                    }).withFailureHandler((err) => alert("Error: " + err)).deleteDataClient(nik);
                } else {
                    alertSpreadsheetRuntimeRequired();
                }
            };

            // === HANDLER: USULAN PENSIUN ===
            const openUsulModal = (emp, e) => {
                if (e) setClickPos({ x: e.clientX, y: e.clientY });
                setUsulTarget(emp);
                setUsulCatatan('');
                setIsUsulModalOpen(true);
            };

            const submitUsulan = () => {
                if (!usulTarget) return;
                setIsSubmittingUsul(true);
                const payload = { ...usulTarget, catatan: usulCatatan || '-' };
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            setIsSubmittingUsul(false);
                            const parsed = JSON.parse(res);
                            if (parsed.error) alert("Gagal: " + parsed.message);
                            else {
                                setIsUsulModalOpen(false);
                                alert("Usulan pensiun berhasil diajukan! Cek di tab Riwayat Usulan.");
                                onRefreshData();
                            }
                        })
                        .withFailureHandler((err) => { setIsSubmittingUsul(false); alert("Error: " + err); })
                        .usulkanPensiunClient(payload);
                } else {
                    setIsSubmittingUsul(false);
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleACC = (u) => {
                if (!confirm(`ACC usulan pensiun untuk ${u.nama_karyawan}?\n\nData akan DIPINDAH dari DB_KARYAWAN ke DB_PENSIUN secara permanen.`)) return;
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            const parsed = JSON.parse(res);
                            if (parsed.error) alert("Gagal ACC: " + parsed.message);
                            else { alert("✅ Pensiun ACC! Data sudah pindah ke DB_PENSIUN."); fetchUsulan(); onRefreshData(); }
                        })
                        .withFailureHandler((err) => alert("Error: " + err))
                        .accUsulanPensiunClient(u.nik);
                } else {
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleTolak = (u) => {
                if (!confirm(`Tolak usulan pensiun untuk ${u.nama_karyawan}?\n\nStatus karyawan akan dikembalikan ke Aktif.`)) return;
                if (isSpreadsheetRuntimeReady()) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            const parsed = JSON.parse(res);
                            if (parsed.error) alert("Gagal: " + parsed.message);
                            else { alert("Usulan ditolak. Status karyawan dikembalikan ke Aktif."); fetchUsulan(); onRefreshData(); }
                        })
                        .withFailureHandler((err) => alert("Error: " + err))
                        .tolakUsulanPensiunClient(u.nik);
                } else {
                    alertSpreadsheetRuntimeRequired();
                }
            };

            const handleExportExcel = () => {
                if (filteredData.length === 0) return alert("Tidak ada data untuk diekspor!");
                const exportData = filteredData.map(emp => ({
                    'NIK': emp.nik || '-', 'Nama Pegawai': emp.nama_karyawan || '-',
                    'Usia Saat Ini': emp.usia || '', 'Jabatan': emp.nama_posisi || '-',
                    'Unit Kerja': emp.nama_unit || '-', 'Status Pegawai': emp.nama_employee_group || 'Aktif',
                    'Tgl Mulai Kerja': emp.tgl_mulaikerja || '', 'Tgl Pensiun': emp.tgl_pensiun || '',
                    'Masa Kerja Berjalan': emp.masaKerja, 'Sisa Waktu': emp.countdown, 'Kategori': emp.statusLabel
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Daftar_Pensiun");
                XLSX.writeFile(wb, `Laporan_Pensiun_Area3_TIF.xlsx`, { bookType: "xlsx" });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rawData = XLSX.utils.sheet_to_json(ws, { defval: "" });
                        if (rawData.length === 0) { alert("File kosong atau format salah."); setIsUploading(false); return; }
                        const jsonData = rawData.map(row => {
                            let obj = { nik: row['NIK'] || row['nik'] };
                            if (row['Usia Saat Ini']) obj.usia = String(row['Usia Saat Ini']).replace(/\D/g, '');
                            else if (row['usia']) obj.usia = row['usia'];
                            if (row['Tgl Mulai Kerja']) obj.tgl_mulaikerja = row['Tgl Mulai Kerja'];
                            else if (row['tgl_mulaikerja']) obj.tgl_mulaikerja = row['tgl_mulaikerja'];
                            if (row['Tgl Pensiun']) obj.tgl_pensiun = row['Tgl Pensiun'];
                            else if (row['tgl_pensiun']) obj.tgl_pensiun = row['tgl_pensiun'];
                            if (row['Status Pegawai']) obj.nama_employee_group = row['Status Pegawai'];
                            if (row['Nama Pegawai'] || row['Nama Karyawan']) obj.nama_karyawan = row['Nama Pegawai'] || row['Nama Karyawan'];
                            if (row['Jabatan']) obj.nama_posisi = row['Jabatan'];
                            if (row['Unit Kerja']) obj.nama_unit = row['Unit Kerja'];
                            return obj;
                        }).filter(r => r.nik);
                        if (typeof google !== 'undefined' && google.script) {
                            google.script.run
                                .withSuccessHandler((res) => {
                                    setIsUploading(false);
                                    const parsed = JSON.parse(res);
                                    if (parsed.error) alert("Gagal update massal: " + parsed.message);
                                    else { alert("SUKSES! Data Pensiun berhasil diperbarui di Master Pegawai."); onRefreshData(); }
                                })
                                .withFailureHandler((err) => { setIsUploading(false); alert("Error Server: " + err); })
                                .bulkUpdateClient(jsonData);
                        } else { setIsUploading(false); alert("Mode lokal: Upload simulasi massal berhasil."); }
                    } catch (error) { setIsUploading(false); alert("Gagal membaca file CSV/Excel."); }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            if (isLoadingPegawai) return <div className="p-8 text-slate-500"><i className="bx bx-loader-alt bx-spin mr-2"></i>Memuat Data Pensiun...</div>;

            return (
                <div className="fade-in space-y-6 pb-10">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-2 gap-4 toolbar-scroll custom-scrollbar pb-2">
                        <div className="shrink-0">
                            <h1 className="text-2xl font-extrabold text-navy-900">Retirement</h1>
                            <p className="text-sm text-slate-500">Pantau masa kerja & kelola usulan pensiun dari <b>Master Pegawai</b> secara <b>real-time</b>.</p>
                        </div>
                        <div className="flex gap-2 shrink-0">
                            <input type="file" accept=".csv, .xlsx" ref={fileUploadRef} onChange={handleFileUpload} className="hidden" />
                            {activeTab === 'daftar' && (<>
                                <button onClick={handleExportExcel} className="bg-navy-900 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-navy-800 transition flex items-center gap-2">
                                    <i className="bx bx-download text-lg"></i> Ekspor Excel
                                </button>
                            </>)}
                            {activeTab === 'riwayat' && (
                                <button onClick={fetchUsulan} disabled={isLoadingUsulan} className="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2">
                                    <i className={`bx ${isLoadingUsulan ? 'bx-loader-alt bx-spin' : 'bx-refresh'} text-lg`}></i> Refresh
                                </button>
                            )}
                        </div>
                    </div>

                    {/* TAB NAVIGATION */}
                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl w-fit border border-slate-200">
                        <button onClick={() => setActiveTab('daftar')} className={`px-5 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 ${activeTab === 'daftar' ? 'bg-white text-navy-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                            <i className="bx bx-time-five"></i> Daftar Pensiun
                        </button>
                        <button onClick={() => setActiveTab('riwayat')} className={`px-5 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 ${activeTab === 'riwayat' ? 'bg-white text-navy-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                            <i className="bx bx-list-check"></i> Riwayat Usulan Pensiun
                            {usulanData.length > 0 && <span className="bg-violet-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full ml-1">{usulanData.length}</span>}
                        </button>
                    </div>

                    {/* ===== TAB: DAFTAR PENSIUN ===== */}
                    {activeTab === 'daftar' && (<>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div onClick={(e) => openDetail('Total', e)} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex items-center gap-4 cursor-pointer hover:shadow-md hover:border-slate-300 hover:-translate-y-1 transition-all relative group">
                                <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-2xl"><i className="bx bx-group"></i></div>
                                <div><div className="text-xs text-slate-500 font-bold uppercase">Total Pegawai</div><div className="text-2xl font-black text-navy-900">{processedData.length}</div></div>
                                <i className="bx bx-right-top-arrow-circle absolute top-4 right-4 text-xl opacity-0 group-hover:opacity-50 transition-opacity text-slate-400"></i>
                            </div>
